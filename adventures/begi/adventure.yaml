title: Беги!
vote_minutes: 2
start: fair
scenes:
  fair:
    text: |-
      Ярмарка в Тильдберге пахнет мёдом, смолой и горячим хлебом. На площади
      ставят помост для вечернего шоу, и вы пришли именно за этим. Потом небо
      ломается. Молодой дракон — меньше легенд, но больше любой башни — падает
      на город без крика глашатая. Первый удар сносит навес над пирогами.
      Имени зверя вы не знаете. Знаете только, что надо бежать.
    image: images/fair.jpg
    choices:
      - label: Броситься к площади
        next: square
      - label: Нырнуть в торговые ряды
        next: rows
      - label: Бежать к городским воротам
        next: gates

  square:
    text: |-
      Помост разбит в щепки. Стражник с обожжённой рукой ловит вас за плечо:
      «Он прилетел с восточной дороги и шёл за фургоном, как собака за мясником».
      Сказать, чей фургон и зачем, стражник не успевает: над вами крыло
      заслоняет день. Под балкой помоста кто-то тонко зовёт маму.
    image: images/square.jpg
    choices:
      - label: Расспросить стражника
        next: guard
      - label: Вытащить ребёнка из-под балки
        next: child

  rows:
    text: |-
      Торговые ряды горят полосами, как фитили. Мимо протискивается человек
      с рогами и тяжёлым сундуком: плащ дорогой, шаг вороватый. Сундук тёплый
      даже на расстоянии. Он не смотрит на дракона. Он смотрит, не смотрите ли
      на него. У брошенной телеги стоит ящик без замка.
    image: images/rows.jpg
    choices:
      - label: Схватить рогатого за плащ
        next: grab
      - label: Заглянуть в брошенный ящик
        next: crate
      - label: Забиться под прилавок
        next: stall

  gates:
    text: |-
      Ворота забиты телегами. Дракон проходит над дорогой низко, и люди
      становятся теснее смерти. Канава вдоль стены уже полна тех, кто решил
      не быть высоким. За спиной город орёт. Впереди — открытое место,
      по которому огонь ходит, как по столу.
    image: images/gates.jpg
    choices:
      - label: Лечь в канаву и переждать
        next: ditch
      - label: Вернуться в горящий город
        next: alley

  ditch:
    text: |-
      Грязь принимает вас. Жар проходит сверху, как ладонь: кому-то повезло
      меньше, и рядом хрипит человек с тлеющим рукавом. Река левее, если ползти
      не поднимая головы. Встать — стать заметным. И, может быть, вытащить его.
    image: images/ditch.jpg
    choices:
      - label: Ползти к реке, не поднимаясь
        next: river
      - label: Встать и вытащить раненого
        next: death_fire

  death_fire:
    text: |-
      Вы поднимаете его. Он лёгкий и уже не кричит. Дракон возвращается
      на тепло движения. Огонь накрывает двоих сразу, и геройство длится
      ровно столько, сколько горит плащ. Тильдберг этого не замечает:
      ему есть кого считать и без вас.
    image: images/death_fire.jpg
    choices: []

  guard:
    text: |-
      Стражник говорит быстро, пока хватает рта: «Торговец. Рога. Фургон
      расписной, у колодца. В книге ярмарки имя — Заксис». Зачем зверю купец,
      он не знает. В рёве над крышами на миг слышится что-то похожее на имя,
      и тонет в огне. Стражник машет на восток и больше не машет.
    image: images/guard.jpg
    choices:
      - label: Искать фургон Заксиса
        next: wagon
      - label: Бежать к воротам, выкрикивая имя
        next: mob

  child:
    text: |-
      Балка тяжёлая, ребёнок живой. Мать прижимает его и шепчет вам в ухо,
      будто дракон умеет читать губы: «Рогатый спрятал сундук в часовне,
      за алтарём. Не открывайте при людях». У вас обожжённые ладони и чужая
      тайна. До ворот ребёнка надо ещё довести.
    image: images/child.jpg
    choices:
      - label: Идти в часовню
        next: chapel
      - label: Вывести ребёнка к воротам
        next: gates_child

  grab:
    text: |-
      Плащ остаётся в кулаке. Он оборачивается: тифлинг, глаза как монеты
      в огне. «Заксис, — цедит он. — Купец, не ваш враг. Доведите за стену,
      кошель ваш. Сундук не трогайте: от него пожары». За деньги он предлагает
      провод. За вопросы — ничего.
    image: images/grab.jpg
    choices:
      - label: Взять деньги и вести его
        next: escort
      - label: Потребовать открыть сундук
        next: egg
      - label: Крикнуть «держите вора»
        next: mob

  crate:
    text: |-
      Ящик не заперт. Внутри яйцо ростом с бочонок: медная чешуя, и оно стучит
      не как камень, а как сердце. Дракон над рынком вдруг складывает крылья
      и орёт так, будто его позвали кровью. Хозяина ящика нет. Есть тепло
      и город, который за это тепло уже платит.
    image: images/crate.jpg
    choices:
      - label: Нести яйцо дракону
        next: end_half
      - label: Искать того, кто его вёз
        next: chapel
      - label: Спрятать яйцо и бежать к реке
        next: end_coward

  stall:
    text: |-
      Под прилавком темно и сыро от пролитого пива. Шёпот не вам, а в щель:
      «Яйцо у него в сундуке. Пока не отдаст, зверь не уйдёт». Коготь сдирает
      доски над головой, и шёпот обрывается вместе с ними. Часовня в одной
      стороне. Река — в другой.
    image: images/stall.jpg
    choices:
      - label: Выкатиться к часовне
        next: chapel
      - label: Ползти к реке
        next: river

  alley:
    text: |-
      Переулок узкий: дракону сюда не сложить крылья, зато падают кирпичи.
      В одном конце слышна река. В другом зверь сел на площадь, как судья.
      Можно уйти и так ничего не узнать. Можно лечь среди мертвых и слушать.
    image: images/alley.jpg
    choices:
      - label: К реке
        next: river
      - label: На площадь, притвориться мёртвым
        next: deadish

  wagon:
    text: |-
      Расписной фургон стоит у колодца, лошади нет. Заксис запихивает сундук
      в солому и видит, что вы знаете имя. Улыбка у него торговая даже сейчас.
      «Помогите выбраться. Заплачу сверху цены за место в лодке. Что в сундуке —
      товар, и товар не ваш».
    image: images/wagon.jpg
    choices:
      - label: Согласиться вывезти его
        next: escort
      - label: Обыскать фургон
        next: egg
      - label: Связать и тащить на площадь
        next: drag

  chapel:
    text: |-
      Часовня без крыши. Святые на стенах почернели от копоти раньше, чем
      от грехов. За алтарём сундук, возле него Заксис — на коленях не перед
      богом. «Я просто торговец, — говорит он. — Выведите меня, и я не забуду».
      Крышка ещё закрыта. Город за стенами часовни забывает людей быстрее.
    image: images/chapel.jpg
    choices:
      - label: Открыть сундук
        next: egg
      - label: Поверить и вести его к реке
        next: escort

  escort:
    text: |-
      Вы ведёте его дворами. Сундук бьёт по ноге в такт шагу, слишком ровно
      для золота. У реки цела одна лодка. Заксис сыплет в ладонь монеты —
      хорошие, не клад, а плата проводнику. «Дальше сами. Не оглядывайтесь:
      город уже не ваш клиент».
    image: images/escort.jpg
    choices:
      - label: Сесть в лодку, не открывая сундук
        next: end_paid
      - label: Открыть сундук у воды
        next: egg

  egg:
    text: |-
      Крышка поднимается. Яйцо дышит жаром, и Заксис перестаёт играть купца.
      «Да, драконье. Зверь хочет своё обратно и меня в придачу. Отдадите обоих —
      город, может, увидит утро, а я нет. Отпустите с яйцом — под старой
      таможней три сундука. Я жив, вы богаты, Тильдберга нет». Он не просит
      жалости. Он называет цену.
    image: images/egg.jpg
    choices:
      - label: Отдать яйцо и Заксиса дракону
        next: end_save
      - label: Взять клад и бежать с ним
        next: end_hoard
      - label: Разбить яйцо
        next: end_smash

  mob:
    text: |-
      Имени достаточно. Толпе, которой нечего бояться по частям, нужны рога,
      и она их находит. Заксиса выталкивают на площадь, как плату. Дракон
      спускается за ним одним. Яйцо всё ещё где-то в городе: зверь рвёт навесы,
      ищет тепло и не находит. Пока он занят телом, у вас есть минута.
    image: images/mob.jpg
    choices:
      - label: Достать яйцо и донести дракону
        next: end_save
      - label: Бежать, пока дракон занят
        next: end_mob

  gates_child:
    text: |-
      У калитки стражник ставит ладонь вам в грудь. Ребёнок проходит, вы — нет.
      «Один. Или он, или вы, или никто». Сзади давят телегами. Под ногой
      решётка стока, узкая, грязная и свободная только для того, кто останется.
    image: images/gates_child.jpg
    choices:
      - label: Отдать место ребёнку и лезть в сток
        next: end_sewer
      - label: Протолкнуть обоих сквозь толпу
        next: end_crush

  river:
    text: |-
      Река чёрная от пепла. Лодка одна, вёсла мокрые. Город за спиной орёт
      всё тише не потому, что спасён. Можно уйти прямо сейчас и так и не узнать,
      как звали зверя и за что он пришёл. Можно вернуться и лечь там, где слушают.
    image: images/river.jpg
    choices:
      - label: Угнать лодку и не оглядываться
        next: end_river
      - label: Вернуться и притвориться мёртвым
        next: deadish

  deadish:
    text: |-
      Вы ложитесь среди тех, кто уже не играет. Дракон проходит так близко,
      что чешуя пахнет грозой. Он орёт не «умрите». Он орёт имя — своё, —
      в ярости, что его не слышат: Галдарактис. Потом садится и ждёт,
      будто имя было дверью, а город до неё не дошёл.
    image: images/deadish.jpg
    choices:
      - label: Встать и назвать его по имени
        next: named
      - label: Уползти к реке
        next: river

  named:
    text: |-
      «Галдарактис», — говорите вы, и молодой дракон замирает, обиженный
      точностью. Голос у него как треск горящей балки. «Яйцо. И вор. До колокола.
      Принесёшь — город останется стоять местами. Соврёшь — я выучу ваши голоса
      лучше, чем вы выучили моё».
    image: images/named.jpg
    choices:
      - label: Искать фургон вора
        next: wagon_truth
      - label: Солгать, что яйцо уже у реки
        next: end_lie

  wagon_truth:
    text: |-
      Колокол ещё не бил. Заксис смотрит вам в лицо и понимает: вы знаете
      и про яйцо, и про срок. Нож он не достаёт. Достаёт другую цену.
      «Три сундука под таможней. Я исчезаю с яйцом. Или тащите меня к нему
      и будьте героем, от которого пахнет чужим костром».
    image: images/wagon_truth.jpg
    choices:
      - label: Открыть сундук и решать у него на глазах
        next: egg
      - label: Сразу отдать дракону его и яйцо
        next: end_save

  drag:
    text: |-
      Верёвка держит рога плохо, руки — крепко. Сундук с яйцом бьётся о колено.
      На полпути Заксис бросает мелкую торговлю. «Под таможней клад. Развяжите —
      покажу, и мы оба переживём эту ночь. Отдадите меня зверю — получите город
      и мою смерть. Свидетелей уже нет. Есть вы».
    image: images/drag.jpg
    choices:
      - label: Принять клад и бежать с ним
        next: end_hoard
      - label: Отдать дракону Заксиса и яйцо
        next: end_save

  end_save:
    text: |-
      Вы выходите туда, где сидит зверь, с яйцом в руках. Заксис рядом:
      сам не дошёл бы. Дракон забирает своё и на миг становится просто молодым
      и усталым. Потом одного удара хватает на тифлинга. Имени вам может
      ещё не быть известно, но уходя он бросает его в пепел, как подпись:
      Галдарактис. Крылья поднимают его над стенами. Огонь гаснет.
      Утро у города будет. У Заксиса — нет.
    image: images/end_save.jpg
    choices: []

  end_hoard:
    text: |-
      Клад на месте: три сундука, сухие, тяжёлые, без сердца внутри.
      Заксис жив и не благодарит. К рассвету вы уже далеко, а Тильдберг
      стоит столбом дыма, видным с тракта. Галдарактис — имя вы, может,
      так и не узнаете — ищет яйцо дольше, чем живут крыши. Вы богаты.
      Город рассчитался за ваши сундуки.
    image: images/end_hoard.jpg
    choices: []

  end_paid:
    text: |-
      Лодка отходит. Монеты в кармане настоящие, сундук стучит один раз,
      как кулак изнутри, и вы не открываете. Заксис сидит к вам спиной.
      Он купил проводника, не свидетеля. За кормой Тильдберг горит до самой
      воды. Вы так и не спросили, как звали дракона и что именно вы спасли
      вместе с рогатым купцом.
    image: images/end_paid.jpg
    choices: []

  end_half:
    text: |-
      Вы кладёте яйцо на камни площади. Дракон берёт его бережно, почти
      страшно, и этого недостаточно: он нюхает воздух и не находит вора.
      Рынок он сжигает уже после, ища запах рук, которые яйцо украли.
      Перед рассветом улетает — с яйцом и с половиной Тильдберга.
      Вы живы. Счёт в городе другой.
    image: images/end_half.jpg
    choices: []

  end_coward:
    text: |-
      Яйцо вы закапываете под мешками у реки, будто тепло можно спрятать
      от того, кто слышит его сквозь стены. Лодка уносит вас. До утра дракон
      разбирает Тильдберг крышу за крышей. Вы далеко и целы. Где-то под мешками
      всё ещё стучит сердце, а город за это стучание уже не ответит.
    image: images/end_coward.jpg
    choices: []

  end_smash:
    text: |-
      Скорлупа поддаётся с мокрым звуком. Внутри что-то недоделанное успевает
      вскрикнуть, и дракон слышит конец своего детёныша лучше любого имени.
      Дальше нет погони и нет сделки. Тильдберг становится одним пламенем,
      и вы в нём не исключение. Победа над яйцом длится одну секунду.
    image: images/end_smash.jpg
    choices: []

  end_mob:
    text: |-
      Вы бежите, пока дракон занят Заксисом. Тифлинг умирает на площади
      без суда, который вы на него накричали. Яйцо остаётся в городе.
      С холма видно, как зверь до утра рвёт крыши в поисках тепла и не уходит.
      Вы спаслись. Заксис — нет. Тильдберг — тоже нет.
    image: images/end_mob.jpg
    choices: []

  end_sewer:
    text: |-
      Ребёнок уже за стеной: мать зовёт его по имени, и это единственное имя,
      которое сегодня стоило выучить. Вы выползаете из стока по ту сторону рва,
      грязный и живой. Тильдберг за спиной догорает. Вы спасли одного.
      Узнали ли вы, можно ли было спасти остальных, — нет.
    image: images/end_sewer.jpg
    choices: []

  end_crush:
    text: |-
      Калитка выпускает вас двоих поверх человека, который больше не встаёт.
      Стражник матерится вам вслед и не успевает вытащить того, кто упал.
      Снаружи воздух холодный. Ребёнок держит ваш рукав и отпускает сам.
      За спиной город горит. Вы выбрались. Цена лежит в воротах и молчит.
    image: images/end_crush.jpg
    choices: []

  end_river:
    text: |-
      Вёсла тяжёлые, пепел садится на воду плёнкой. Вы живы и небогаты
      ничем, кроме этого. Как звали дракона, кто его привёл и можно ли было
      остановить пожар, остаётся на том берегу, который вы больше не видите.
      Тильдберг светится за поворотом реки и потом гаснет за лесом.
    image: images/end_river.jpg
    choices: []

  end_lie:
    text: |-
      Галдарактис верит на один пролёт и уходит к реке. Вы бежите в поле,
      в другую сторону. Он находит ил, пустые лодки и возвращается. Второй
      пожар с поля виден лучше первого. Вы живы. Имя, которое вы у него
      выпросили, вы потратили на ложь, и он это имя запомнит вместе с голосом.
    image: images/end_lie.jpg
    choices: []
