title: Дети Биовэйва — Сигнал на девять (иной сказ)
vote_minutes: 60
start: afterglow
scenes:
  afterglow:
    text: |-
      Контракт уже взяли. Роли разобрали без вас: соло — Молот,
      техник — Искра, нетраннер — Шепот. Вы — четвёртый лишний
      и самый нужный: тот, кто держит волну банды, пока трое лезут
      в «Синусоиду».

      Клик смотрит на вас поверх голограммы. «Чумба, ты не в зале.
      Ты — дирижёр снаружи. Решай, как поём эту ночь.»
    image: images/afterglow.jpg
    choices:
      - label: Вести операцию из фургона Шины — чистый контроль
        next: van_control
      - label: Пойти в клуб как гражданский глаз
        next: club_eye
      - label: Слить корпу ложный план и сыграть навстречь
        next: false_flag
        fail: false_flag_burn
        chance: [40, 70]

  van_control:
    text: |-
      В «Вэйвраннере» жарко от серверов. На трёх экранах — Молот,
      Искра, Шепот. Ваш голос в их имплантах — закон. Первая развилка:
      охрана меняет патруль на десять минут раньше.
    image: images/van_control.jpg
    choices:
      - label: Послать Молота в лоб — давить статусом
        next: hammer_push
        fail: hammer_heat
        chance: [35, 65]
      - label: Попросить Искру открыть сервис раньше срока
        next: spark_early
      - label: Дернуть Шепота — вырезать патруль из сетки
        next: whisper_cut

  club_eye:
    text: |-
      Вы в толпе «Синусоиды» без ствола — только с меткой Биовэйва
      под кожей и бокалом, который не пьёте. Видите то, чего нет
      на камерах: корп-покупатель уже в ложе, ждёт кейс.
    image: images/club_eye.jpg
    choices:
      - label: Сесть рядом и заговорить с покупателем
        next: buyer_talk
        fail: buyer_make
        chance: [40, 75]
      - label: Передать Молоту метку ложи по взгляду
        next: mark_lodge
      - label: Уйти в туалет и джек-ин с гостевого порта
        next: guest_jack

  false_flag:
    text: |-
      Вы «случайно» светите NCPD маршрут через восточный лифт.
      Патрули сходятся туда. Команда идёт на запад. Красиво —
      пока Клик не пишет: «Корп купил ваш слив. Они ждут на западе.»
    image: images/false_flag.jpg
    choices:
      - label: Развернуть команду обратно на восток — в хаос копов
        next: east_chaos
      - label: Идти ва-банк на запад и бить первыми
        next: west_ambush
        fail: west_fail
        chance: [30, 60]
      - label: Заморозить дельце и вытащить людей
        next: abort_run

  false_flag_burn:
    text: |-
      Слив читают быстрее вас. Молота берут у барной стойки.
      Искра орёт в рации. Шепот выжигает себе выход. Вы —

      дирижёр без оркестра. Остаётся только выбирать, кого спасать.
    image: images/false_flag_burn.jpg
    choices:
      - label: Выкупить Молота у патруля эдди банды
        next: ending_bail
      - label: Бросить сигнал «рассыпаться» и исчезнуть
        next: ending_scatter
      - label: Сдать Клика корпу в обмен на своих
        next: ending_trade

  hammer_push:
    text: |-
      Молот проходит. Охрана верит голосу, который звучит как деньги.
      Искра уже у шлюза. Шепот держит камеры. Кейс почти ваш —
      пока покупатель в ложе не поднимает трубку.
    image: images/hammer_push.jpg
    choices:
      - label: Приказать брать кейс сейчас
        next: grab_now
      - label: Сначала вырубить покупателя через Шепота
        next: silence_buyer
        fail: grab_now
        chance: [45, 70]
      - label: Сменить цель — взять покупателя в клещи
        next: kidnap_buyer

  hammer_heat:
    text: |-
      Молота раскрывают. Стволы. Кровь на белом полу. Вы слышите,
      как его стимулятор орёт на вашей частоте — просьба о огневой.
    image: images/hammer_heat.jpg
    choices:
      - label: Дать зелёный на жёсткий прорыв
        next: ending_scar
      - label: Тянуть Искру на эвакуацию Молота
        next: ending_extract
      - label: Глушить его хром — чтобы не взяли живым с данными
        next: ending_mercy

  spark_early:
    text: |-
      Искра открывает рано. Шлюз ползёт. Внутри кейс… и второй,
      пустой, с маячком. Кто-то ждал дирижёра, который торопится.
    image: images/spark_early.jpg
    choices:
      - label: Брать оба и разбираться в фургоне
        next: both_cases
      - label: Брать тяжёлый, лёгкий оставить петь
        next: grab_now
      - label: Не брать — это приманка, жечь этаж
        next: burn_floor
        fail: grab_now
        chance: [40, 65]

  whisper_cut:
    text: |-
      Шепот вырезает патруль — и вместе с ним кусок чужого раннера.
      В сети на секунду вспыхивает лицо Клики с корп-тегом.
      «Видели?» — шипит Шепот. «Фиксер в доле с железом.»
    image: images/whisper_cut.jpg
    choices:
      - label: Продолжать дельце — разборки потом
        next: grab_now
      - label: "Сменить задачу: собрать компромат на Клика"
        next: kompromat
      - label: Оборвать и устроить Клику встречу на рампе
        next: twist_klik

  buyer_talk:
    text: |-
      Покупатель пьёт воду и говорит как человек без имени:
      «Мне нужен сигнал, не банда. Продам вам жизнь за частоту.»
      На столе — чемодан эдди и контракт на ваших друзей.
    image: images/buyer_talk.jpg
    choices:
      - label: Играть согласие — и передать координаты Молоту
        next: mark_lodge
      - label: Честно отказаться и уйти
        next: mark_lodge
      - label: Взять эдди и предать команду
        next: ending_sellout

  buyer_make:
    text: |-
      Он узнаёт метку Биовэйва под кожей. Улыбка становится дверью
      в закрытую комнату. Охрана уже здесь. В ухе — тишина: глушилка.
    image: images/buyer_make.jpg
    choices:
      - label: Бить первым, пока не скрутили
        next: ending_scar
      - label: Кричать частоту аварийного сбора
        next: ending_extract
        fail: ending_cage
        chance: [35, 60]

  mark_lodge:
    text: |-
      Молот читает ваш взгляд как карту. Ложи лишают гостя.
      Кейс уходит в сервисный лифт — туда, где Искра держит дверь.
    image: images/mark_lodge.jpg
    choices:
      - label: Сигнал «чисто — на рампу»
        next: twist_klik
      - label: Сигнал «подмена — пусть ложа получит болванку»
        next: ending_ocean
      - label: Сигнал «жжём улики и растворяемся»
        next: ending_burn

  guest_jack:
    text: |-
      Гостевой порт грязный, но живой. Вы на минуту становитесь
      четвёртым в сети Шепота — и видите Клика со стороны железа.
    image: images/guest_jack.jpg
    choices:
      - label: Скинуть Шепоту пакет компромата
        next: kompromat
      - label: Открыть Молоту короткий коридор
        next: hammer_push
      - label: Заложить вирус в сделку покупателя
        next: ending_wave

  east_chaos:
    text: |-
      Восток — мясорубка из мигалок. Команда проходит сквозь неё,
      как нож сквозь дым. Кейс у Искры. Копы потом будут искать
      «призрак Биовэйва» в отчётах.
    image: images/east_chaos.jpg
    choices:
      - label: Увести всех на рампу
        next: twist_klik
      - label: Оставить маячок копам и раствориться
        next: ending_fade

  west_ambush:
    text: |-
      Вы бьёте первыми. Корп не ждал дирижёра с улицы. Кейс ваш.
      Клик на связи молчит слишком долго — значит, считает убытки.
    image: images/west_ambush.jpg
    choices:
      - label: Встретить его на рампе с правдой
        next: twist_klik
      - label: Не встречаться — сразу в эфир банды
        next: ending_legend

  west_fail:
    text: |-
      Запад оказался мешком. Молот ранен. Кейс у корпуса. Ваша волна
      теперь в их лаборатории — на препарировании.
    image: images/west_fail.jpg
    choices:
      - label: Готовить отбивную операцию через неделю
        next: ending_hunt
      - label: Признать ночь проигранной
        next: ending_scatter

  abort_run:
    text: |-
      Вы тянете стоп. Трое выходят живыми, злыми, без кейса.
      Клик орёт. Банда смотрит на вас — на того, кто умеет
      проигрывать до того, как начнут хоронить.
    image: images/abort_run.jpg
    choices: []

  both_cases:
    text: |-
      В фургоне вскрываете оба. Тяжёлый — настоящий. Лёгкий —
      бомба-маяк на частоте Биовэйва. Вы успеваете выкинуть её
      в ливнёвку за секунду до пинга.
    image: images/both_cases.jpg
    choices:
      - label: Везите настоящий на рампу
        next: twist_klik
      - label: Уничтожить оба — слишком грязно
        next: ending_burn

  grab_now:
    text: |-
      Кейс у команды. Город ещё не понял. Рампа близко.
      Клик уже там — слишком вовремя.
    image: images/grab_now.jpg
    choices:
      - label: Идти на встречу
        next: twist_klik
      - label: Сменить точку на крышу Кабуки
        next: ending_fade
        fail: twist_klik
        chance: [40, 70]

  silence_buyer:
    text: |-
      Шепот гасит ложу. Покупатель «засыпает» с открытыми глазами.
      Кейс легче брать, когда никто не торгуется.
    image: images/silence_buyer.jpg
    choices:
      - label: Забирать и валить
        next: twist_klik
      - label: Забрать ещё и его чемодан эдди
        next: ending_ocean

  kidnap_buyer:
    text: |-
      Покупатель в мешке полезнее кейса: он знает, кто ещё заказывал
      «Биовэйв-9». Дельце меняет жанр — из ограбления в похищение.
    image: images/kidnap_buyer.jpg
    choices: []

  burn_floor:
    text: |-
      Этаж вспыхивает без жертв — Искра волшебница. Кейса нет.
      Зато нет и чужой игрушки. Клик не получает процент. Банда
      получает миф.
    image: images/burn_floor.jpg
    choices: []

  kompromat:
    text: |-
      Пакет на Клика тяжёлый: счета, созвоны, корп-бейдж в метаданных.
      Дельце можно добить — или объявить сезон охоты на фиксера.
    image: images/kompromat.jpg
    choices:
      - label: Добить кейс, потом суд банды
        next: grab_now
      - label: Сорвать дельце и кинуть Клика в эфир сейчас
        next: ending_legend

  twist_klik:
    text: |-
      Рампа. Клик один — или притворяется. За спиной ни корпа,
      ни двойника: только дождь и запах его страха.
      «Я мог продать, — говорит он. — Не продал. Докажи обратное.»
    image: images/twist_klik.jpg
    choices:
      - label: Поверить и отдать ему долю за молчание
        next: ending_deal
      - label: Сломать его легенду при команде
        next: ending_blood
      - label: Дать уйти — но без частоты и без будущего в районе
        next: ending_exile

  ending_bail:
    text: |-
      Молота выкупают. Эдди банды тают. Кейса нет. Вы — дирижёр,
      который заплатил за жизнь солиста. В «Пульсе» вам всё равно
      наливают: свои должны возвращаться.
    image: images/ending_bail.jpg
    choices: []

  ending_scatter:
    text: |-
      Сигнал «рассыпаться». Каждый сам. История ночи расползается
      на три сплетни и ни одного отчёта. Иногда так выживают.
    image: images/ending_scatter.jpg
    choices: []

  ending_trade:
    text: |-
      Корп получает Клика. Вы получаете Молота и Искру. Шепот
      не прощает вам бухгалтерию душ — и уходит с частоты навсегда.
      Дети Биовэйва целы. Гармония — нет.
    image: images/ending_trade.jpg
    choices: []

  ending_scar:
    text: |-
      Прорыв громкий. Кейс ваш. Шрамы — тоже. На стене у «Пульса»
      новое имя. Ваше остаётся в рации как голос, который сказал
      «давай» в худшую секунду.
    image: images/ending_scar.jpg
    choices: []

  ending_extract:
    text: |-
      Вытаскиваете своих под огнём. Кейс остаётся корпу. Зато
      на рампе все дышат. Клик не получает ничего — и это уже плата.
    image: images/ending_extract.jpg
    choices: []

  ending_mercy:
    text: |-
      Вы глушите хром Молота. Его не пыляют данными. Его вообще
      почти не успевают поднять — Искра вытаскивает тело.
      Он выживет. Не простит. Банда поймёт оба факта.
    image: images/ending_mercy.jpg
    choices: []

  ending_sellout:
    text: |-
      Эдди тёплые. Друзья — нет. Частота Биовэйва в ваших руках
      звучит фальшиво. Найт-Сити это прощает. «Пульс» — нет.
    image: images/ending_sellout.jpg
    choices: []

  ending_cage:
    text: |-
      Закрытая комната. Глушилка. Вашу метку снимают аккуратно,
      как кожу. Банда потом найдёт пустой бокал на столе ложи —
      и поймёт всё без слов.
    image: images/ending_cage.jpg
    choices: []

  ending_ocean:
    text: |-
      Болванка, чемодан, запись голоса Клика — ночь складывается
      в красивый развод. Вы дирижировали не ограблением. Вы
      дирижировали унижением жадности. Титры. Бас. Титры ещё раз.
    image: images/ending_ocean.jpg
    choices: []

  ending_burn:
    text: |-
      Огонь стирает сигнал. Нет прототипа — нет хора. Выходите
      без профита и с чистой совестью, которая в Найт-Сити
      редкий имплант.
    image: images/ending_burn.jpg
    choices: []

  ending_fade:
    text: |-
      Точка сменена. Кейс в Кабуки. Клик орёт в пустоту. Вы уже
      пьёте в другом баре и слушаете, как район сам сочиняет легенду.
    image: images/ending_fade.jpg
    choices: []

  ending_wave:
    text: |-
      Вирус в сделке покупателя взрывает половину корпоративных
      плейлистов Watson. Хром пляшет. Ваша банда уходит под эту
      музыку. «Сигнал на девять» становится треком, не грузом.
    image: images/ending_wave.jpg
    choices: []

  ending_legend:
    text: |-
      Эфир рвёт Клика на байты. Дети Биовэйва получают частоту
      без посредника. Вас больше не зовут четвёртым лишним.
      Вас зовут тем, кто держит такт.
    image: images/ending_legend.jpg
    choices: []

  ending_hunt:
    text: |-
      Неделя подготовки. Потом — отбивная. История продолжается
      уже не этим свитком: вы оставляете закладку на следующую ночь.
    image: images/ending_hunt.jpg
    choices: []

  ending_deal:
    text: |-
      Доля Клики за молчание. Кейс у банды. Мир тонкий, как лёд
      на луже. Вы знаете: он треснет. Но не сегодня.
    image: images/ending_deal.jpg
    choices: []

  ending_blood:
    text: |-
      Правда ломает ему зубы. Команда смотрит и кивает. Фиксера
      больше нет. Есть предупреждение другим. Кейс тяжелее от крови —
      и легче от вранья.
    image: images/ending_blood.jpg
    choices: []

  ending_exile:
    text: |-
      Клик уходит живым и пустым. Без частоты, без района, без имени
      в ваших списках. Дождь смывает его шаги. Вы разворачиваете
      фургон — дельце закрыто без титров, зато без петли на шее.
    image: images/ending_exile.jpg
    choices: []
