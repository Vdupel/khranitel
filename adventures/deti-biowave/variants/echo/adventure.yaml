title: Дети Биовэйва — Сигнал на девять (эхо)
vote_minutes: 60
start: briefing
scenes:
  briefing:
    text: |-
      «Пульс» тот же: озон, текила, чужие амбиции. Клик крутит
      голограмму «Синусоиды» — но на этот раз подсветка кейса
      «Биовэйв-9» моргает в противофазе, будто прототип уже кто-то
      трогал.

      «Дельце то же, чумба. Роли те же. Только волна сегодня чужая:
      кто-то поёт на нашей частоте. Соло, техник, нетраннер —
      выбирай, пока эхо не выбрало тебя.»
    choices:
      - label: Соло — мышцы, стволы и контроль зала
        next: solo_prep
      - label: Техник — замки, дроны и тихий саботаж
        next: tech_prep
      - label: Нетраннер — лёд, камеры и архитектура сети
        next: net_prep

  solo_prep:
    text: |-
      Хром послушен, но оптика ловит двоичное: каждый охранник
      на секунду имеет «тень» с той же походкой. Клик шепчет:
      «Не стреляй в эхо. Оно не падает. Бей оригинал.»
    choices:
      - label: Смокинг — войти как «деньги»
        next: solo_entry_vip
      - label: Куртка охраны — войти как «свои»
        next: solo_entry_guard

  solo_entry_vip:
    text: |-
      Швейцар кивает двум вашим лицам — и пускает одно. В зале бас
      запаздывает на долю удара. VIP-дверь спрашивает пароль,
      которого нет в брифе.
    choices:
      - label: Подкупить пачкой эдди и уверенностью
        next: solo_floor
        fail: solo_floor_hard
        chance: [35, 65]
      - label: Тихо вырубить и протащить через служебную
        next: solo_floor_hard

  solo_entry_guard:
    text: |-
      Код смены «волна-17» уже использовали минуту назад. Сержант
      щурит оптику: «Двое новичков за ночь? Корп экономит на лицах.»
    choices:
      - label: Сопроводить «гостя» и увести патруль
        next: solo_floor
      - label: Отправить сержанта по ложному вызову
        next: solo_floor_hard
        fail: solo_floor
        chance: [40, 70]

  solo_floor:
    text: |-
      Коридор бел. Камеры моргают — нетраннер держит. Но у шлюза
      стоят не двое, а четверо: два живых, два — чуть прозрачнее.
    choices:
      - label: Отвлечь разговором и дать команде окно
        next: vault_solo_smooth
        fail: vault_solo_loud
        chance: [30, 60]
      - label: Разоружить быстро и жёстко
        next: vault_solo_loud

  solo_floor_hard:
    text: |-
      Порох пахнет озоном дважды — выстрел и его эхо из вентиляции.
      Тревога не орёт: она шепчет на частоте Биовэйва. Клик в ухе:
      «Вас уже поют. Забирайте кейс или станете припевом.»
    choices:
      - label: Прорваться к шлюзу на стимуляторе
        next: vault_solo_loud
      - label: Заставить технаря открыть раньше срока
        next: vault_solo_smooth

  vault_solo_smooth:
    text: |-
      Кейс в руках вибрирует в противофазе к вашему пульсу.
      На парковке — два «Вэйвраннера». Один — Шина. Второй —
      пустой, но с тёплым двигателем.
    choices:
      - label: Забрать прототип и идти к Шине по плану
        next: twist_mole
      - label: Оставить маячок-обманку и уйти с муляжом на виду
        next: twist_double

  vault_solo_loud:
    text: |-
      Громкая дорожка. Прототип орёт вашей же татуировкой на шее.
      Эхо охраны бежит впереди живой — и ждёт у лифта.
    choices:
      - label: Пробиваться к лифту через зал
        next: twist_heat
      - label: Прыгать в шахту сервисного подъёмника
        next: twist_mole

  tech_prep:
    text: |-
      «Клещ» калибруется нормально, пока не начинает строить карту
      шахт, которых нет в чертеже NeoWave. Кто-то уже проложил
      дыры — и оставил их петь на вашей волне.
    choices:
      - label: Ставка на дронов и сервисные шахты
        next: tech_entry_ducts
      - label: Ставка на эмп и поддельный ремоут смены
        next: tech_entry_emp

  tech_entry_ducts:
    text: |-
      В шахте два шва: ваш будущий и чужой вчерашний. Чужой теплее.
    choices:
      - label: Вскрыть решётку и идти своим маршрутом
        next: tech_systems
        fail: tech_trap
        chance: [35, 70]
      - label: Проследить чужой шов до источника
        next: tech_trap

  tech_entry_emp:
    text: |-
      Сканер засыпает — и во сне показывает чужой бейдж: ваш,
      но со вчерашней датой. Логи слишком зелёные. Снова.
    choices:
      - label: Игнорировать и вести команду к шлюзу
        next: tech_systems
      - label: Перепроверить логи — ищи подвох
        next: tech_trap

  tech_trap:
    text: |-
      Коробка «Красных Хромов» внутри оказалась пустой. Снаружи —
      наклейка Биовэйва, перевёрнутая. Кто-то мимикрирует под вас.
      Клик сухо: «Либо сожги. Либо поставь зеркало.»
    choices:
      - label: Сжечь ловушку и идти чисто
        next: tech_systems
      - label: Перепрошить — пусть нарвутся на своё эхо
        next: vault_tech_bait

  tech_systems:
    text: |-
      Клетка с «Биовэйв-9» открывается — и внутри два кейса-близнеца.
      Индикаторы одинаковые. Вес разный на граммы.
    choices:
      - label: Аккуратно снять клетку штатным протоколом
        next: vault_tech_clean
        fail: vault_tech_dirty
        chance: [40, 75]
      - label: Вырезать питание — быстрее, но грязнее
        next: vault_tech_dirty

  vault_tech_bait:
    text: |-
      Зеркало срабатывает: чужая команда клюёт на ваш фантом.
      Настоящий кейс у вас. На рампе Клик улыбается слишком рано.
    choices:
      - label: Уйти по шахтам к Шине
        next: twist_double
      - label: Подождать и посмотреть, кто клюнет
        next: twist_mole

  vault_tech_clean:
    text: |-
      Вы берёте более тяжёлый. Лёгкий оставляете петь в клетке —
      пусть эхо охраняет пустоту. Почти идеально.
    choices:
      - label: Сигнал Шине — выходим по плану
        next: twist_mole
      - label: Подменить прототип болванкой из мастерской
        next: twist_double

  vault_tech_dirty:
    text: |-
      Питание падает. Оба кейса орут разом. Вы хватаете
      наугад. Сирена — с задержкой, как бас в зале.
    choices:
      - label: Держать темп к парковке
        next: twist_heat
      - label: Запечатать этаж эмпом — сжечь хвост
        next: twist_mole

  net_prep:
    text: |-
      Льды ложатся ровно, пока «Биовэйв-рукопожатие» не отвечает
      само себе. В сети уже сидит «вы» — аватар с вашей меткой
      и чужим пингом.
    choices:
      - label: Джек-ин из фургона — дальняя поддержка
        next: net_entry_van
      - label: Джек-ин из серверной клуба — ближе к железу
        next: net_entry_local

  net_entry_van:
    text: |-
      Стеклянные зубы NeoWave. На узле — два следа: ржавый лис
      и ваш почерк вчерашней ночью, которой не было.
    choices:
      - label: Выжечь чужой след и занять узел
        next: net_run
        fail: net_rival
        chance: [40, 70]
      - label: Проследить след до оператора
        next: net_rival

  net_entry_local:
    text: |-
      В дверь серверной стучат три коротких — и ещё три, чуть тише,
      будто эхо рук.
    choices:
      - label: Игнорировать — держать ран
        next: net_run
      - label: Глянуть камеру у двери
        next: net_rival

  net_rival:
    text: |-
      Дредды, тату «Красные Хромы»… и поверх — полустёртая волна
      Биовэйва. Лис скалится: «Я не враг. Я ремейк. Поделитесь
      частотой — или я обрушу вас обоих.»
    choices:
      - label: Заключить мгновенную сделку — 30% им за тишину
        next: vault_net_deal
      - label: Вырезать её из архитектуры насильно
        next: net_run_war

  net_run:
    text: |-
      Камеры спят. ИИ хранилища моргает двумя зрачками.
    choices:
      - label: Усыпить ИИ мягко — рискуя временем
        next: vault_net_clean
        fail: vault_net_alarm
        chance: [35, 65]
      - label: Ударить грубо — рискуя тревогой
        next: vault_net_alarm

  net_run_war:
    text: |-
      Война копий. Лифты пляшут. Вы удерживаете узел ценой крови
      из носа — и чужого визга в коде.
    choices:
      - label: Удержать контроль и вывести команду
        next: vault_net_alarm
      - label: Бросить лишний цикл на побег — целее уйдём
        next: vault_net_clean

  vault_net_deal:
    text: |-
      Тридцать процентов на словах. На деле лис уже поёт вашим
      рукопожатием. Кейс у команды. Частота — под вопросом.
    choices:
      - label: Честно отдать долю на выходе
        next: twist_double
      - label: Подменить их долю болванкой
        next: twist_mole

  vault_net_clean:
    text: |-
      ИИ спит одним глазом. Команда скользит. В голове остаётся
      чужой припев на вашей волне.
    choices:
      - label: Выходить по плану
        next: twist_mole
      - label: Оставить в сети закладку Биовэйва на потом
        next: twist_double

  vault_net_alarm:
    text: |-
      Красная стена. Двери держатся. Прототип у соло. Эхо тревоги
      бежит по району быстрее патрулей.
    choices:
      - label: Держать коридор цифрой до последнего
        next: twist_heat
      - label: Сжечь серверную и рвать кабель
        next: twist_mole

  twist_mole:
    text: |-
      На рампе — Клик и корп. Но Кликов двое: один считает эдди,
      второй шепчет вам в приват: «Стреляй в того, что без запаха
      текилы. Я — живой.» Искра смотрит в пол обоими лицами.
    choices:
      - label: Сдать прототип и купить выход живыми
        next: ending_deal
      - label: Поднять стволы — Клик и корп не уходят
        next: ending_blood
      - label: Сыграть по сценарию Оушена — у нас уже подмена
        next: ending_ocean

  twist_double:
    text: |-
      Болванка уезжает. Настоящий кейс под сиденьем. Клик на линии
      звучит как ремейк собственной жадности — на полтона выше.
    choices:
      - label: Сказать «чисто» и подставить Клика на болванке
        next: ending_ocean
      - label: Вывести Клика на чистую воду в эфире банды
        next: ending_legend
      - label: Разрубить узел — уничтожить прототип в прямом эфире
        next: ending_burn

  twist_heat:
    text: |-
      Улицы Watson вспыхивают дважды: сине-красным и его послесвечением.
      Прототип заставляет чужой хром танцевать с задержкой — жуткий хор.
    choices:
      - label: Прорваться через крыши и дворы
        next: ending_scar
      - label: Бросить маячок и раствориться в толпе
        next: ending_fade
      - label: Включить «Биовэйв-9» на короткой волне — хаос как щит
        next: ending_wave

  ending_deal:
    text: |-
      Вы отдаёте кейс. Живыми выходите. Наутро на рынке два «Биовэйв-9»
      с вашей меткой — и оба фальшивые. Кто-то купил эхо. Кто-то —
      время. Дети Биовэйва целы и тише обычного.
    choices: []

  ending_blood:
    text: |-
      Стреляете в того, что без запаха — и попадаете верно.
      Живой Клик ранен, но кивает. Корп падает. Кейс ваш.
      Район будет петь эту ночь с реверберацией.
    choices: []

  ending_ocean:
    text: |-
      Болванка раскрывается под чужими пальцами — и орёт записью,
      где Клик продаёт вас дважды: корпу и своему отражению.
      Настоящий прототип у банды. Титры можно катить два раза подряд.
    choices: []

  ending_legend:
    text: |-
      Эфир взрывается. Кликов из списков вычёркивают парой.
      «Биовэйв-9» ставит район на одну волну без эха предательства.
      Вас узнают по паузе перед ответом — будто ждёте второй голос
      и не дождаетесь. Это комплимент.
    choices: []

  ending_burn:
    text: |-
      Прототип вспыхивает. Вместе с ним гаснет чужой ремейк частоты.
      Нет товара — нет эха. В «Пульсе» наливают бесплатно тем,
      кто умеет проигрывать красиво.
    choices: []

  ending_scar:
    text: |-
      Прорыв стоит шрама и одного имени на стене у «Пульса».
      Неон «Сигнал на девять» мигает иногда лишним кадром —
      памятью о том, кто остался в послесвечении мигалок.
    choices: []

  ending_fade:
    text: |-
      Маячок уезжает. Вы растворяетесь. Настоящий импульс лежит
      в ящике Кабуки — и ещё один, пустой, поёт рядом, чтобы сбить
      со следа. Тихий профит с подстраховкой.
    choices: []

  ending_wave:
    text: |-
      Короткая волна. Хром города сходит с ума в каноне: удар — ответ.
      Фургон уходит внутри этой фуги. К утру Watson помнит ночь,
      когда улица пела сама себе на бис.
    choices: []
