title: Дети Биовэйва — Сигнал на девять
vote_minutes: 60
start: briefing
scenes:
  briefing:
    text: |-
      «Пульс» воняет озоном, синтетическим текилой и чужими амбициями.
      Над столом фиксер Клик крутит голограмму: клуб «Синусоида», под ним —
      хранилище NeoWave Labs. Внутри — прототип «Биовэйв-9», передатчик,
      который может гладить чужой хром на частоте вашей банды… или выжигать
      нервы целиком кварталу.

      «Дети Биовэйва берут своё, чумба, — Клик улыбается без тепла. —
      Это не налёт качками. Это балет. Как у тех легенд из старых фильмов:
      каждый — нота, вместе — аккорд. Шина уже греет развозной «Вэйвраннер».
      Искра пилит бейджи. Осталось закрыть одну роль.»

      Контракт вспыхивает тремя иконками. Выбираешь — и ночь становится твоей.
    choices:
      - label: Соло — мышцы, стволы и контроль зала
        next: solo_prep
      - label: Техник — замки, дроны и тихий саботаж
        next: tech_prep
      - label: Нетраннер — лёд, камеры и архитектура сети
        next: net_prep

  # ——— СОЛО ———
  solo_prep:
    text: |-
      Ты проверяешь магазины на ощупь, как чётки. В зеркале — чужой,
      полезный зверь: саберроны в предплечьях, оптика с тепловым контуром,
      под кожей — стимулятор, который Клик называет «второй жизнью на минуту».

      «Твоя партия простая, — говорит он. — Ты — лицо и кулак. Пока техник
      дырявит сервис, а нетраннер держит камеры слепыми, ты ведёшь VIP-коридор
      так, будто тебе тут платят. Если запахнет порохом — ты решаешь, кто
      уходит на ногах.»

      На столе два комплекта: смокинг с кевларовой подкладкой и курьерская
      куртка охраны NeoWave.
    choices:
      - label: Смокинг — войти как «деньги»
        next: solo_entry_vip
      - label: Куртка охраны — войти как «свои»
        next: solo_entry_guard

  solo_entry_vip:
    text: |-
      На входе в «Синусоиду» свет режет сетчатку неоном. Ты киваешь
      швейцару так, будто у тебя в импланте лежит счёт с лишними нулями.
      Имя на бейдже — чужое, улыбка — твоя. В зале пульсирует бас,
      под которым прячется лифт к лабораториям.

      Охранник у VIP-двери щурит оптику. «Плюс один не заявлен.»
      За спиной — очередь из хромированных хищников. Время тает.
    choices:
      - label: Подкупить пачкой эдди и уверенностью
        next: solo_floor
        fail: solo_floor_hard
        chance: [40, 70]
      - label: Тихо вырубить и протащить через служебную
        next: solo_floor_hard

  solo_entry_guard:
    text: |-
      Куртка сидит почти правдой. Искра в ухе шепчет код смены: «волна-17».
      Ты проходишь рамку, киваешь коллегам, которых видишь впервые, и забираешь
      планшет обхода. В подсобке пахнет озоном и дешёвым кофе.

      Внезапно настоящий сержант смены: «Эй, новичок. Лифт B на ремонте.
      Веди гостя из ложи к сервисной. И без фейерверков.»
    choices:
      - label: Сопроводить «гостя» и увести патруль
        next: solo_floor
      - label: Отправить сержанта по ложному вызову
        next: solo_floor_hard

  solo_floor:
    text: |-
      Коридор к хранилищу — белый, как операционная. Твои шаги звучат
      легитимно. Камеры моргают «занято»: нетраннер работает. Дверь
      сервисной уже дышит щелью — техник на месте.

      Впереди двое с пушками у шлюза «Биовэйв-9». Они ещё не знают,
      что ночь принадлежит Детям.
    choices:
      - label: Отвлечь разговором и дать команде окно
        next: vault_solo_smooth
        fail: vault_solo_loud
        chance: [35, 65]
      - label: Разоружить быстро и жёстко
        next: vault_solo_loud

  solo_floor_hard:
    text: |-
      Тишина ломается коротко — глухой удар, стон, тело в нише.
      Сирена не орёт… пока. Но на этаже уже чужая нервозность:
      рации шипят, ботинки ускоряются.

      «Соло, у тебя минута, — голос Клика в импланте. — Потом волна
      охраны с верхнего танцпола. Забирай ритм или нас смоют.»
    choices:
      - label: Прорваться к шлюзу на стимуляторе
        next: vault_solo_loud
      - label: Заставить технаря открыть раньше срока
        next: vault_solo_smooth

  vault_solo_smooth:
    text: |-
      Ты держишь зал словом и осанкой, пока шлюз ползёт вверх.
      В капсуле — «Биовэйв-9»: чёрный параллелепипед с пульсирующей
      бирюзовой жилкой. Как сердце банды, только настоящее.

      Искра свистит в рации: «Красиво, чумба. Но на парковке чужой фургон.
      Не наши.»
    choices:
      - label: Забрать прототип и идти к Шине по плану
        next: twist_mole
      - label: Оставить маячок-обманку и уйти с муляжом на виду
        next: twist_double

  vault_solo_loud:
    text: |-
      Коридор становится строчкой из дульных вспышек. Ты — ритм-секция:
      шаг, выстрел, шаг. Охрана сыплется, но NeoWave уже знает:
      кто-то играет громко.

      Прототип у тебя в руках. Он вибрирует, будто узнаёт татуировку
      Биовэйва у тебя на шее. Тревога воет на всех частотах.
    choices:
      - label: Пробиваться к лифту через зал
        next: twist_heat
      - label: Прыгать в шахту сервисного подъёмника
        next: twist_mole

  # ——— ТЕХНИК ———
  tech_prep:
    text: |-
      Верстак в подвале «Пульса» выглядит как алтарь. Ты паяешь эмп-петушок
      размером с сигарету, калибруешь паука-дрон «Клещ» и прошиваешь
      бейджи так, что система примет вас за ночную бригаду клининга.

      «Техник — это тот, кого не замечают, пока не поздно, — Клик крутит
      в пальцах микросхему. — Соло шумит, нетраннер шепчет нулями.
      Ты делаешь так, чтобы двери думали, будто сами захотели открыться.»
    choices:
      - label: Ставка на дронов и сервисные шахты
        next: tech_entry_ducts
      - label: Ставка на эмп и поддельный ремоут смены
        next: tech_entry_emp

  tech_entry_ducts:
    text: |-
      «Клещ» ползёт первым. Карта воздуховодов ложится на сетчатку:
      повороты, датчики пыли, мёртвая зона над серверной. Ты лезешь следом —
      плечи узкие ровно настолько, чтобы пройти.

      Внизу, за решёткой, шлюз хранилища. На трубе — свежий сварной шов:
      кто-то готовил дыру раньше вас. Или готовит ловушку.
    choices:
      - label: Вскрыть решётку и идти своим маршрутом
        next: tech_systems
        fail: tech_trap
        chance: [40, 75]
      - label: Проследить чужой шов до источника
        next: tech_trap

  tech_entry_emp:
    text: |-
      На служебном входе сканер чихает от твоего петушка — и «засыпает»
      на сорок секунд. Ровно столько, чтобы провести соло и ящик с инструментом.
      Внутри пахнет горячим пластиком: ты уже перешил два замка, третий ноет.

      Планшет смены показывает зелёный статус. Слишком зелёный.
    choices:
      - label: Игнорировать и вести команду к шлюзу
        next: tech_systems
      - label: Перепроверить логи — ищи подвох
        next: tech_trap

  tech_trap:
    text: |-
      Чужой шов ведёт к коробке с логотипом не NeoWave — а «Красных Хромов»,
      мелких падальщиков с Пасифики. Внутри — датчик и передатчик:
      они хотели снять сливки после вас.

      «Классика, — цедит Клик. — Можешь сжечь их сюрприз… или перепрошить
      под нас и подарить им наш фейерверк.»
    choices:
      - label: Сжечь ловушку и идти чисто
        next: tech_systems
      - label: Перепрошить — пусть Красные Хромы нарвутся
        next: vault_tech_bait

  tech_systems:
    text: |-
      Замки поют под твоими руками. Шлюз, давление, температурный контур —
      всё становится послушным. Нетраннер в ухе: «Камеры на петле.
      Соло держит коридор. Забирай игрушку.»

      «Биовэйв-9» лежит в магнитной клетке. Снять клетку без хлопка —
      задача на нервы и пинцет.
    choices:
      - label: Аккуратно снять клетку штатным протоколом
        next: vault_tech_clean
      - label: Вырезать питание — быстрее, но грязнее
        next: vault_tech_dirty

  vault_tech_bait:
    text: |-
      Ты оставляешь Красным Хромам «подарок»: их датчик теперь орёт
      на их же частоте, когда кто-то полезет следом. Шлюз открыт.
      Прототип у тебя. Наверху бас клуба не подозревает, что под полом
      уже идёт война версий одной и той же жадности.
    choices:
      - label: Уйти по шахтам к Шине
        next: twist_double
      - label: Подождать и посмотреть, кто клюнет
        next: twist_mole

  vault_tech_clean:
    text: |-
      Клетка гаснет без драмы. «Биовэйв-9» ложится в термочехол, будто
      спал и ждал своих. Индикаторы смены зелёные. Почти идеальный кадр
      из старого фильма про красивые ограбления.
    choices:
      - label: Сигнал Шине — выходим по плану
        next: twist_mole
      - label: Подменить прототип болванкой из мастерской
        next: twist_double

  vault_tech_dirty:
    text: |-
      Питание падает. Клетка щёлкает, сирена на этаже просыпается на полтона
      позже, чем должна. Ты уже бежишь с чехлом под мышкой. В рации — мат
      соло и сухой смешок нетраннера: «Я торможу двери. Не благодари.»
    choices:
      - label: Держать темп к парковке
        next: twist_heat
      - label: Запечатать этаж эмпом — сжечь хвост
        next: twist_mole

  # ——— НЕТРАННЕР ———
  net_prep:
    text: |-
      Ты раскладываешь льды, как хирург — инструменты. «Песнь Волны»,
      «Игла», самописный «Биовэйв-рукопожатие», который банда бережёт
      для своих. Кресло в фургоне Шины скрипит. Снаружи — ночь Найт-Сити,
      внутри — твоя война.

      «Нетраннер видит правду раньше пуль, — Клик смотрит не на тебя,
      а в пустоту, будто уже в сети. — Соло и техник — руки. Ты — нервная
      система этой ночи. Ослепнешь — и нас положат. Удержишь — и мы станем
      легендой района.»
    choices:
      - label: Джек-ин из фургона — дальняя поддержка
        next: net_entry_van
      - label: Джек-ин из серверной клуба — ближе к железу
        next: net_entry_local

  net_entry_van:
    text: |-
      Мир сменяется геометрией. Фаерволы NeoWave — стекло и зубы.
      Ты скользишь между бастионами, подменяешь хэши смен, кормишь
      камеры петлёй с пустым коридором.

      В глубине архитектуры — чёрный узел с меткой, которой нет в доках:
      чужой раннер уже сидел тут. След свежий.
    choices:
      - label: Выжечь чужой след и занять узел
        next: net_run
      - label: Проследить след до оператора
        next: net_rival

  net_entry_local:
    text: |-
      Серверная под «Синусоидой» гудит, как улей. Ты втыкаешься напрямую —
      пинг сладкий, опасный. Лёд толще, зато руки короче: шлюз хранилища
      почти на ладони.

      Кто-то стучит в дверь серверной снаружи. Три коротких. Не код команды.
    choices:
      - label: Игнорировать — держать ран
        next: net_run
      - label: Глянуть камеру у двери
        next: net_rival

  net_rival:
    text: |-
      Это не охрана. В отражении линзы — девчонка с неоновыми дреддами
      и тату «Красные Хромы» на скуле. Она тоже здесь за «Биовэйв-9».
      В сети её аватар — ржавый лис.

      «Дети Биовэйва опоздали, — шипит она в общий канал, будто знает,
      что ты слышишь. — Или поделитесь… или я обрушу вам лифты.»
    choices:
      - label: Заключить мгновенную сделку — 30% им за тишину
        next: vault_net_deal
      - label: Вырезать её из архитектуры насильно
        next: net_run_war

  net_run:
    text: |-
      Ты танцуешь. Камеры спят, замки поют, охрана смотрит в фейковые
      логи. Соло проходит как тень с правом доступа. Техник снимает клетку.
      «Биовэйв-9» отмечается в инвентаре команды зелёной точкой.

      Почти. Контрольный ИИ хранилища просыпается на полсекунды раньше,
      чем ты успеваешь погладить его скриптом.
    choices:
      - label: Усыпить ИИ мягко — рискуя временем
        next: vault_net_clean
      - label: Ударить грубо — рискуя тревогой
        next: vault_net_alarm

  net_run_war:
    text: |-
      Лис визжит в коде. Ты ломаешь ей дайв, она жжёт тебе маршруты.
      В мясном мире сыплются искры из щитков. Соло орёт, что лифты пляшут.
      Но узел ваш. Прототип — тоже, если успеете вынести тело.
    choices:
      - label: Удержать контроль и вывести команду
        next: vault_net_alarm
      - label: Бросить лишний цикл на побег — целее уйдём
        next: vault_net_clean

  vault_net_deal:
    text: |-
      Сделка пахнет предательством заранее — и всё равно работает.
      Красные Хромы отводят глаза камер, вы забираете «Биовэйв-9».
      На парковке их фургон уже мурлычет. Тридцать процентов. На словах.
    choices:
      - label: Честно отдать долю на выходе
        next: twist_double
      - label: Подменить их долю болванкой
        next: twist_mole

  vault_net_clean:
    text: |-
      ИИ снова спит, будто ему приснился хороший квартал. Команда скользит
      к выходу. В твоей голове ещё звенит чужой лис — но прототип ваш,
      и бас «Синусоиды» кроет шаги лучше любого стелса.
    choices:
      - label: Выходить по плану
        next: twist_mole
      - label: Оставить в сети закладку Биовэйва на потом
        next: twist_double

  vault_net_alarm:
    text: |-
      Тревога — красная стена. Ты держишь двери, пока тело команды бежит.
      Кровь из носа на клавиатуре фургона — мелочь. «Биовэйв-9» уже у соло.
      Осталось не дать NeoWave сложить вас в отчёт.
    choices:
      - label: Держать коридор цифрой до последнего
        next: twist_heat
      - label: Сжечь серверную и рвать кабель
        next: twist_mole

  # ——— ПОВОРОТЫ (общие) ———
  twist_mole:
    text: |-
      На рампе у «Вэйвраннера» Клик встречает вас не один.
      Рядом — человек в сером костюме без лишних логотипов: корп-посредник.
      Искра стоит чуть в стороне, глаза в пол. Рация шипит её частотой —
      той самой, что «слишком зелёные» логи.

      «Бизнес, чумбы, — Клик разводит руками. — NeoWave платит за возврат
      и за головы. Я продал вам мечту. Им — адрес. Теперь выберите,
      чем закончится фильм.»
    choices:
      - label: Сдать прототип и купить выход живыми
        next: ending_deal
      - label: Поднять стволы — Клик и корп не уходят
        next: ending_blood
      - label: Сыграть по сценарию Оушена — у нас уже подмена
        next: ending_ocean

  twist_double:
    text: |-
      План Б щёлкает идеально: болванка уезжает в чужие руки,
      настоящий «Биовэйв-9» — в тайнике под сиденьем Шины.
      Клик звонит слишком быстро, будто ждал чужого сигнала.

      «Говорите, что чисто, — просит он. — У меня покупатель на линии.»
      В голосе — жадность. В жадности — щель.
    choices:
      - label: Сказать «чисто» и подставить Клика на болванке
        next: ending_ocean
      - label: Вывести Клика на чистую воду в эфире банды
        next: ending_legend
      - label: Разрубить узел — уничтожить прототип в прямом эфире
        next: ending_burn

  twist_heat:
    text: |-
      Улицы Watson вспыхивают сине-красным. Trauma Team чует кровь,
      NCPD чует хайп, а «Синусоида» чует дыру в бюджете. Шина орёт,
      что мост перекрыт. Прототип орёт на своей частоте — и соседний
      хром зевак начинает подтанцовывать без спроса.
    choices:
      - label: Прорваться через крыши и дворы
        next: ending_scar
      - label: Бросить маячок и раствориться в толпе
        next: ending_fade
      - label: Включить «Биовэйв-9» на короткой волне — хаос как щит
        next: ending_wave

  # ——— КОНЦОВКИ ———
  ending_deal:
    text: |-
      Вы отдаёте кейс. Корп кивает. Клик считает эдди. Вас не убивают —
      это тоже валюта в Найт-Сити. Наутро Дети Биовэйва целы, но тише.
      Кто-то называет это профессионализмом. Кто-то — трусостью.

      Через неделю на чёрном рынке всплывает прошивка с вашей меткой.
      Значит, ночь была не совсем напрасной. Или совсем чужой.
    choices: []

  ending_blood:
    text: |-
      Смокинг и куртки становятся броней. Короткий бой на рампе —
      и Клик больше не улыбается. Корп успевает послать сигнал; дольше
      ему не нужно. Вы уезжаете с «Биовэйв-9» и дырой в команде:
      Искра ранена, доверие — тоже.

      Банда поёт вашу историю громко. Улицы — тише, потому что боятся.
      В Найт-Сити это почти счастье.
    choices: []

  ending_ocean:
    text: |-
      Когда кейс открывают не те пальцы, внутри — красивая смерть репутации:
      болванка, открытка с логотипом Биовэйва и петля записи, где Клик
      торгует вами ещё до брифинга. Настоящий прототип уже у ваших.
      Эдди капают с трёх сторон: корп в бешенстве, Клик в бегах,
      район в восторге.

      «Вот это, чумба, — цедит Шина, выкручивая руль, — я понимаю
      как дельце.» Ночь пахнет озоном и победой. Титры можно катить.
    choices: []

  ending_legend:
    text: |-
      Эфир банды взрывается доказательством. Клика изымают из списков
      живых фиксеров быстрее, чем он успевает соврать. «Биовэйв-9»
      становится не товаром, а знаменем: Дети ставят передатчик на свою
      волну и кроют им чужой хром только по приговору совета.

      Тебя больше не спрашивают, кто ты — соло, техник или нетраннер.
      Спрашивают: «Ты был на „Синусоиде“?» И кивают заранее.
    choices: []

  ending_burn:
    text: |-
      Передатчик вспыхивает белым и становится дорогой пылью.
      Клик орёт. Корп орёт. Банда молчит… а потом начинает смеяться.
      Никто не получит кнопку на чужие нервы. Частота Биовэйва остаётся
      легендой, а не продуктом.

      В «Пульсе» тебе наливают бесплатно. В Найт-Сити это редкий навык:
      уйти без эдди — и всё равно выиграть.
    choices: []

  ending_scar:
    text: |-
      Вы вырываетесь. Цена — шрам, который не закроет ни один риппер:
      кто-то из команды остаётся на мосту в синем свете мигалок.
      Прототип ваш. Победа горькая, как синтетический виски без льда.

      Дети Биовэйва не забывают своих. Имя выбивают на стене у «Пульса».
      Рядом — свежий неон: «Сигнал на девять».
    choices: []

  ending_fade:
    text: |-
      Маячок уезжает с патрулем. Вы — в толпе, без кейса, без гимнов.
      Наутро Клик пишет: «Пусто.» Корп пишет: «Пусто.» Только ты знаешь,
      в каком почтовом ящике Кабуки лежит настоящий импульс.

      Тихий профит. Без титров. Иногда так и надо, чумба.
    choices: []

  ending_wave:
    text: |-
      Ты включаешь «Биовэйв-9» на короткой. Хром вокруг сходит с ума:
      танцует, глючит, открывает двери без спроса. В этом хаосе ваш фургон —
      просто ещё одна судорога города. Вы уходите на своей частоте.

      К утру весь Watson говорит о ночи, когда улица пела. NeoWave
      открещивается. Дети Биовэйва — нет. Вы не просто ограбили склад.
      Вы поставили трек.
    choices: []
