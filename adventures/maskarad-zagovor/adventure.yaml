title: Маскарад — Кровь на пороге
vote_minutes: 60
start: wake
scenes:
  wake:
    text: |-
      Вы просыпаетесь не от света — от жажды. Сердце молчит. Воздух
      пахнет пылью подвала и чужой дорогой парфюмерией. Над вами —
      сир: женщина с глазами без бликов, в пальто цвета запёкшейся крови.

      «Добро пожаловать в Ночь, дитя, — говорит она ровно. — Я Элена.
      Ты теперь Сородич. Есть законы, и первый из них — Маскарад:
      смертные не должны знать. Второй — не убивай князя. Третий…
      третий узнаешь, если доживёшь до совета.»

      На столе — ключ от квартиры «наверху», телефон без контактов
      и конверт без адреса. Печать: серебряный анкх Камарильи… поверх
      чужой царапины, будто печать ставили второпях.
    choices:
      - label: Спросить сира про конверт сразу
        next: ask_sire
      - label: Спрятать конверт и выйти в город одному
        next: street
        fail: street_hunger
        chance: [40, 70]
      - label: Вскрыть конверт при ней
        next: open_watched

  ask_sire:
    text: |-
      Элена не берёт конверт. «Мне его подбросили к твоему гробу.
      Либо это приветствие двора, либо петля. Новообращённых любят
      использовать как курьеров — и как улики.» Она кивает на дверь.
      «Элизиум сегодня в старом театре. Князь ждёт представления.
      Я буду там. Ты — тоже. Что сделаешь с письмом до рассвета —
      решит, останешься ли ты моим наследником… или чьим-то ножом.»
    choices:
      - label: Отнести конверт князю нечитанным
        next: prince_sealed
      - label: Прочитать тайком и решить потом
        next: read_alone
        fail: read_caught
        chance: [35, 65]
      - label: Отнести конверт тем, чей знак под анкхом
        next: conspirators

  open_watched:
    text: |-
      Печать трескается. Внутри — одна строка чужим почерком:
      «Двор сгнил. В полночь у нижней сцены — те, кто устал кланяться.
      Приведи сира или принеси её пепел. — Р.»

      Элена читает через ваше плечо. Лицо не меняется. «„Р.“ — Рената,
      примоген Бруха. Или тот, кто хочет, чтобы я так подумала.
      Выбирай сторону до театра. Я не вожу за руку.»
    choices:
      - label: Идти с Эленой на Элизиум — предупредить князя
        next: elysium_warn
      - label: Идти на нижнюю сцену к «Р.»
        next: conspirators
      - label: Сделать вид, что не поняли, и раствориться в городе
        next: street

  street:
    text: |-
      Город сверху слишком яркий. Сердце смертных стучит в автобусах,
      в барах, в очередях. Жажда шепчет проще законов. На углу —
      афиша театра: «Закрытый показ. Только по приглашениям.»
      У входа уже стоят те, чьи глаза тоже без бликов.
    choices:
      - label: Попытаться проскользнуть на Элизиум без сира
        next: elysium_sneak
        fail: elysium_denied
        chance: [40, 75]
      - label: Найти нижнюю сцену до полночи
        next: conspirators
      - label: Позвонить Элене и получить приказ
        next: ask_sire

  street_hunger:
    text: |-
      Жажда обгоняет ум. Вы не помните лица — только тепло и стыд.
      Маскарад дрогнул: смартфон смертного пишет «112» вашими пальцами
      на автоповторе. Вы выбрасываете трубку. Конверт в кармане
      тяжелеет, будто напитался чужим страхом.
    choices:
      - label: Спрятать следы и идти в театр
        next: elysium_sneak
        fail: elysium_denied
        chance: [30, 55]
      - label: Признаться сиру в срыве
        next: confess_sire
      - label: Использовать хаос — бежать к «Р.»
        next: conspirators

  read_alone:
    text: |-
      Строка та же: полночь, нижняя сцена, «Р.», выбор между сиром
      и пеплом. На обороте — мелкая приписка кровью: «Камарилья
      сдает город Шабашу по частям. Не будь деталью.»

      За дверью — шаги Элены. Она не входит. Ждёт, сделаете ли вы
      её союзником или пунктом в чужом плане.
    choices:
      - label: Показать ей письмо и предложить вместе идти к князю
        next: elysium_warn
      - label: Скрыть текст и пойти к заговорщикам
        next: conspirators
      - label: Порвать письмо и выбрать только Маскарад — без сторон
        next: elysium_sneak

  read_caught:
    text: |-
      Элена заходит в миг, когда печать уже сломана. «Любопытство —
      не преступление, — говорит она. — Ложь сиру — почти.» Она
      забирает лист. «Теперь это моя игра. Ты будешь лицом.
      На нижней сцене скажешь, что пришёл от меня. Узнаем, кто „Р.“»
    choices:
      - label: Согласиться быть приманкой
        next: bait
      - label: Отказаться и бежать к князю самому
        next: prince_sealed
        fail: street_hunger
        chance: [40, 70]
      - label: Отказаться и всё же идти к «Р.» честно
        next: conspirators

  confess_sire:
    text: |-
      Элена слушает про кровь и «112» без крика. «Зверь голоден,
      суд — нет. Завтра будет разбор. Сегодня — театр. Конверт.»
      Она не спрашивает, читали ли вы. Смотрит так, будто уже знает.
    choices:
      - label: Отдать конверт ей
        next: ask_sire
      - label: Настоять, что пойдёте к князю вместе
        next: elysium_warn
      - label: Уйти к нижней сцене, пока она занята судом
        next: conspirators

  prince_sealed:
    text: |-
      Князь принимает в ложе театра. Кожа как пергамент, голос —
      как приговор, который уже написан. Вы кладёте конверт.
      Он не вскрывает. «Печать моя. Царапина — нет. Кто послал
      новообращённого с подделкой, хочет либо войны, либо моей скуки.»

      Примогены смотрят. Кто-то улыбается слишком тепло.
    choices:
      - label: Назвать имя Ренаты вслух
        next: accuse_renata
        fail: accuse_fail
        chance: [35, 65]
      - label: Просить разрешения идти на нижнюю сцену шпионом двора
        next: bait_prince
      - label: Промолчать и встать за спиной сира
        next: elysium_warn

  elysium_sneak:
    text: |-
      Вы внутри. Элизиум пахнет пылью кулис и старой кровью под лаком.
      Оружие нельзя. Голоса нельзя поднимать. На балконе князь.
      У нижней двери — шепот: «Полночь. Сцена. Без Камарильи.»
    choices:
      - label: Предупредить князя шёпотом через слугу
        next: elysium_warn
        fail: elysium_denied
        chance: [45, 75]
      - label: Спуститься к шепоту
        next: conspirators
      - label: Найти Элену в зале
        next: ask_sire

  elysium_denied:
    text: |-
      Вас не пускают — или выталкивают: «Без сира новообращённый —
      шум.» За дверью остаётся свет люстр. У вас — переулок,
      жажда и конверт. Полночь ближе, чем достоинство.
    choices:
      - label: Идти на нижнюю сцену
        next: conspirators
      - label: Ждать Элену снаружи
        next: confess_sire
      - label: Попытаться войти снова через служебный ход
        next: elysium_sneak
        fail: street_hunger
        chance: [25, 50]

  elysium_warn:
    text: |-
      Князь слушает. Элена стоит рядом, как тень с правом голоса.
      «Заговор. Нижняя сцена. „Р.“» В зале холодает. Примоген Бруха —
      женщина с шрамом на губе — не вздрагивает.

      «Тогда пусть дитя докажет, — говорит князь. — Сходит вниз.
      Вернётся со словом. Или не вернётся — и слово всё равно будет.»
    choices:
      - label: Спуститься как глаз Камарильи
        next: bait_prince
      - label: Отказаться — пусть идут шериф и гарпии
        next: ending_coward_court
      - label: Спуститься, но уже решив слушать заговорщиков всерьёз
        next: conspirators

  conspirators:
    text: |-
      Нижняя сцена без света рампы. Рената — или та, что носит её имя —
      сидит на краю люка. Рядом двое: носферату с голосом из трубы
      и тореадор, который улыбается как лезвие.

      «Камарилья продаёт кварталы тишине Шабаша, — говорит она.
      — Князь знает. Примогены спорят о процентах. Нам нужно тело
      новообращённого на подписи — и сир, который слишком любит двор.
      Ты с нами… или ты уже пепел в чужом отчёте.»
    choices:
      - label: Притвориться союзником и выведать план
        next: spy_plan
        fail: join_forced
        chance: [40, 70]
      - label: Честно встать на их сторону
        next: join_true
      - label: Отвергнуть и рвануть наверх к князю
        next: flee_up
        fail: join_forced
        chance: [30, 60]

  bait:
    text: |-
      Вы говорите заговорщикам то, что велела Элена. Они кивают
      слишком легко. Носферату шепчет: «Сир учит куклу говорить.
      Кукла слышит и другое.» На стол кладут второй конверт —
      уже для князя, с вашей кровью на сгибе.
    choices:
      - label: Взять конверт и отнести князю как «улику»
        next: false_evidence
      - label: Признать Элене, что вас раскрыли
        next: confess_sire
      - label: Перевернуться — правда служить «Р.»
        next: join_true

  bait_prince:
    text: |-
      Вы спускаетесь уже меткой двора. Слова заговорщиков те же —
      но теперь вы слышите паузы: они ждут стука шерифа. Рената
      смотрит в вас насквозь. «Князь послал мясо. Мясо может выбрать
      нож.»
    choices:
      - label: Собрать имена и уйти наверх
        next: spy_plan
        fail: flee_up
        chance: [45, 75]
      - label: Остаться и принять их кровь клятвы
        next: join_true
      - label: Ударить первыми — сорвать сходку шумом
        next: ending_masquerade_break

  accuse_renata:
    text: |-
      Имя падает в зал, как разбитый бокал. Рената смеётся.
      «Дитя лает. Кто дал поводок?» Князь поднимает палец —
      и смех гаснет. «Шериф проверит нижнюю сцену. А ты, дитя,
      останешься на виду. Если солгал — кровь. Если прав — милость.»
    choices:
      - label: Настоять и идти с шерифом вниз
        next: bait_prince
      - label: Смягчиться и свалить тень на «подделку печати»
        next: ending_pawn
      - label: Тихо предложить Ренате сделку взглядом
        next: conspirators

  accuse_fail:
    text: |-
      Зал не верит. Гарпия шепчет так, чтобы слышали все: «Сир
      не научил молчать.» Князь отворачивается. Элена закрывает
      глаза на долю секунды — единственная трещинка.
      Вас отпускают… вниз. Без охраны. Как приманку и как мусор.
    choices:
      - label: Идти к заговорщикам без легенды
        next: conspirators
      - label: Бежать из города до рассвета
        next: ending_flee
      - label: Умолять Элену вмешаться
        next: confess_sire

  spy_plan:
    text: |-
      План ясен: в третьем акте гаснет свет Элизиума, шерифа режут
      «анархами», князю подсовывают фальшивый приказ о сдаче порта.
      Подписи — кровью трёх новообращённых. Одна строка уже ваша,
      если вы кивнете.

      Вы успеваете выскользнуть до клятвы. Наверху — выбор, кому
      отдать правду.
    choices:
      - label: Отдать всё князю
        next: ending_loyal
      - label: Отдать Элене и пусть она торгуется
        next: ending_sire_deal
      - label: Продать план обеим сторонам
        next: ending_double

  join_true:
    text: |-
      Вы киваете. Кровь клятвы — горькая, с привкусом ржавчины.
      Рената жмёт ладонь: «Добро пожаловать туда, где Маскарад —
      не закон, а декорация.» В полночь свет гаснет. Вы знаете кусок
      машины. Остановить её ещё можно. Или смазать шестерни кровью.
    choices:
      - label: В последний миг сорвать план изнутри
        next: ending_turncoat
        fail: ending_coup
        chance: [40, 70]
      - label: Довести заговор до конца
        next: ending_coup
      - label: Вывезти Элену из театра до удара
        next: ending_save_sire

  join_forced:
    text: |-
      Вас не отпускают. Носферату держит за запястье сильнее этикета.
      «Ты уже видел лица. Либо клятва, либо люк в фундамент.»
      Рената не улыбается. Тореадор — наоборот.
    choices:
      - label: Дать клятву под давлением
        next: join_true
      - label: Кричать так, чтобы услышал Элизиум
        next: ending_masquerade_break
      - label: Ударить и бежать
        next: flee_up
        fail: ending_ash
        chance: [35, 60]

  flee_up:
    text: |-
      Лестница. Кулисы. Свет. Вы врываетесь в Элизиум с запахом
      нижнего сыра и чужой крови на рукаве. Князь поднимает бровь.
      Слов остаётся мало — до того как заговор заметит пропажу.
    choices:
      - label: Выложить всё, что слышали
        next: ending_loyal
      - label: Выложить часть — и оставить рычаг себе
        next: ending_double
      - label: Потребовать защиту сиру прежде слов
        next: ending_sire_deal

  false_evidence:
    text: |-
      Князь вскрывает «улику» с вашей кровью. Печать сходится.
      Смысл — нет: внутри донос на Элену. Зал поворачивается к сиру.
      Она смотрит на вас без удивления. «Вот и урок.»
    choices:
      - label: Признать подставу заговорщиков
        next: ending_loyal
        fail: ending_pawn
        chance: [40, 65]
      - label: Молчать и дать суду идти
        next: ending_pawn
      - label: Поддержать донос — отмежеваться от сира
        next: ending_coup

  ending_loyal:
    text: |-
      Шериф спускается вовремя. Сходку рвут. Рената отрицает —
      и всё равно теряет кресло. Князь кивает вам раз: для новообращённого
      это орден. Элена коротко касается плеча — почти тепло.

      Маскарад цел. Двор цел. Вы — на виду, а значит, в опасности
      правильного сорта. Первая ночь закончена. Война шепчет со второй.
    choices: []

  ending_sire_deal:
    text: |-
      Элена торгуется жёстче князя. Часть имён уходит в пепел тихо,
      часть — в долги. Вас не благодарят публично. Зато сир шепчет:
      «Ты выжил как мой. Это редкая валюта.» Город не знает, что
      его спасли из-за кулис. Так Камарилья и любит победы.
    choices: []

  ending_double:
    text: |-
      Вы продаёте куски плана вверх и вниз. На неделю становитесь
      незаменимы. На восьмую ночь обе стороны понимают арифметику.
      Вас не убивают сразу — сначала делают предупреждением.
      Маскарад держится. Ваша репутация — нет.
    choices: []

  ending_coup:
    text: |-
      Свет гаснет. Шериф падает. Князь слушает фальшивый приказ,
      пока город уже режут на зоны. Рената поднимает вас рукой:
      «Дитя эпохи.» Элена исчезает из ложи — пеплом или бегством,
      вы не узнаете сразу. Камарилья в этом городе становится словом
      из вчерашних протоколов.
    choices: []

  ending_turncoat:
    text: |-
      В миг удара вы ломаете свой же кусок машины: свет возвращается,
      имена летят наверх, клятва жжёт горло. Вас ненавидят обе стороны —
      и потому оставляют жить как доказательство. Элена говорит тихо:
      «Предатель заговора всё ещё предатель. Но полезный.»
    choices: []

  ending_save_sire:
    text: |-
      Вы вытаскиваете Элену до третьего акта. Театр потом дымит
      чужими планами. Князь удерживает трон ценой квартала.
      Сир смотрит на вас иначе — не как на дитя, как на долг.
      «Однажды я спрошу цену, — говорит она. — Не сегодня.»
    choices: []

  ending_masquerade_break:
    text: |-
      Шум. Смертные телефоны. Вспышки. Дождь из приказов «зачистить».
      Заговор тонет вместе с кусками Элизиума. Ваше лицо попадает
      в утреннюю сводку как «наркотический инцидент». Князь объявляет
      охоту не на Ренату — на вас. Маскарад важнее правды.
    choices: []

  ending_pawn:
    text: |-
      Суд идёт по рельсам, которые кто-то смазал заранее. Элену
      отстраняют. Вас оставляют «под наблюдением» — удобной пешкой
      без сира. Конверт был не письмом. Он был ошейником.
    choices: []

  ending_coward_court:
    text: |-
      Шериф идёт вниз без вас. Возвращается с пеплом на перчатках
      и без Ренаты. Князь доволен. Элена не смотрит. В Ночи трусость
      иногда живучее героизма — и пахнет так, что за столом отодвигают
      бокалы.
    choices: []

  ending_flee:
    text: |-
      Автобус, окраина, чужой рассвет за тонировкой. Жажда едет с вами.
      Камарилья этого города вычеркнет имя. Шабаш, возможно, напишет
      заново. Вы не раскрыли заговор и не приняли его — вы выбрали
      пустую дорогу. Иногда это тоже конец первого акта.
    choices: []

  ending_ash:
    text: |-
      Удар. Люк. Руки носферату. Пепел не болит — болит незавершённость.
      На верхней сцене играют третий акт так, будто вас не было.
      Заговор продолжается. Дитя ночи становится слухом.
    choices: []
