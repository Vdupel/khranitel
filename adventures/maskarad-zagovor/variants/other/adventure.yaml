title: Маскарад — Кровь на пороге (иной сказ)
vote_minutes: 60
start: hunger_lesson
scenes:
  hunger_lesson:
    text: |-
      Вас Обняли три ночи назад. Сегодня Элена впервые отпускает
      одну — «на охоту по правилам». Не убивать. Не светиться.
      Вернуться до третьего удара башенных часов.

      В переулке у клуба «Чернильница» вы находите не кровь…
      а умирающего гарпуна двора. В пальцах у него флешка и шёпот:
      «Князя сдают. Список в… Элен… нет… Рена…» Он рассыпается
      до имени. На стене остаётся мокрый анкх — вверх ногами.
    image: images/hunger_lesson.jpg
    choices:
      - label: Забрать флешку и бежать к сиру
        next: to_sire
      - label: Забрать флешку и искать княжеского шерифа
        next: to_sheriff
        fail: hunted
        chance: [40, 70]
      - label: Оставить всё и сделать вид, что не видели
        next: pretend
        fail: hunted
        chance: [35, 60]

  to_sire:
    text: |-
      Элена вставляет флешку без вопросов. На экране — карта города
      с крестами над доменами Камарильи и датами «передачи».
      Её лицо не читается. «Это либо подарок, либо приговор мне.
      Ты принёс огонь в дом. Теперь выберем, кого им жечь.»
    image: images/to_sire.jpg
    choices:
      - label: Убедить её идти к князю с повинной и уликой
        next: court_confession
        fail: sire_hides
        chance: [40, 75]
      - label: Предложить продать список Ренате
        next: sell_renata
      - label: Спрятать флешку и проверить имена самим
        next: verify_names

  to_sheriff:
    text: |-
      Шериф встречает у чёрного хода театра — словно ждал курьера.
      «Гарпун был мой. Флешка — нет.» Он не отбирает носитель сразу.
      «Новообращённый с уликой — удобная история. Хочешь жить —
      станешь моим ухом на нижней репетиции. Хочешь умереть героем —
      беги к князю в одиночку.»
    image: images/to_sheriff.jpg
    choices:
      - label: Стать ухом шерифа на нижней репетиции
        next: under_rehearsal
      - label: Всё же прорваться к князю самому
        next: lone_prince
        fail: hunted
        chance: [30, 55]
      - label: Отдать флешку и уйти из игры
        next: ending_small

  pretend:
    text: |-
      Вы охотитесь «правильно». К рассвету жажда сыта, совесть —
      нет. В подвале Элена уже знает: «Труп нашли. Твой запах —
      на кирпичах. Либо ты слепец, либо трус. Оба лечатся делом.»
      Она кладёт перед вами ту же флешку. «Кто-то вернул утерянное.
      Работает против нас… или за.»
    image: images/pretend.jpg
    choices:
      - label: Принять приказ сира без спора
        next: verify_names
      - label: Потребовать честного разговора о заговоре
        next: to_sire
      - label: Уйти к анархам квартала — там проще слова
        next: anarch_bar

  hunted:
    text: |-
      Вас ведут не шепы — тихие. Переулки складываются в мешок.
      Голос из темноты: «Дитя с флешкой. Отдай. Или войдёшь в список
      как расход.» Анкх вверх ногами светится мелом на асфальте.
    image: images/hunted.jpg
    choices:
      - label: Отдать флешку и просить отпустить
        next: ending_stripped
      - label: Разбить флешку о стену
        next: ending_blind
      - label: Кричать имя князя — призвать Маскарад как щит
        next: lone_prince
        fail: ending_ash
        chance: [25, 50]

  sire_hides:
    text: |-
      Элена прячет флешку в тайник под плитой. «Князю рано. Сначала
      вычеркнем моё имя из списка — если оно там. Ты проверишь
      три адреса. Без героизма.»
    image: images/sire_hides.jpg
    choices:
      - label: Согласиться на проверку адресов
        next: verify_names
      - label: Украсть флешку из тайника и пойти к князю
        next: lone_prince
        fail: ending_sire_wrath
        chance: [35, 65]
      - label: Сдать тайник шерифу анонимно
        next: to_sheriff

  court_confession:
    text: |-
      Элизиум слушает. Флешка на блюде как улика. Князь не смотрит
      на экран — на Элену. «Сир приводит дитя с приговором двору.
      Мило.» Рената аплодирует одним пальцем. «Или сир приводит
      дитя с подделкой. Ещё милее.»
    image: images/court_confession.jpg
    choices:
      - label: Предложить проверить файл у носферату двора
        next: nos_check
        fail: ending_pawn
        chance: [45, 75]
      - label: Вызвать Ренату на словесную дуэль при гарпиях
        next: harp_duel
      - label: Попросить закрытого разговора с князем
        next: private_prince

  sell_renata:
    text: |-
      Рената принимает товар в гримёрке. Платит не купюрами — кровью
      доступов, долгами, правом сесть ближе. «Умное дитя. Камарилья
      любит предателей, пока они чужие.» Она кивает на дверь:
      «В полночь мы ставим спектакль. Тебе хватит роли.»
    image: images/sell_renata.jpg
    choices:
      - label: Взять роль в заговоре
        next: under_rehearsal
      - label: Забрать её задаток и донести князю
        next: private_prince
        fail: ending_double_dead
        chance: [40, 70]
      - label: Забрать задаток и бежать из города
        next: ending_flee

  verify_names:
    text: |-
      Три адреса. Первый — пустой склад с запахом гари. Второй —
      клуб анархов, где ваше лицо уже на стене. Третий — особняк
      примогена, в окне которого горит свет… днём, под шторами,
      чужим делом.
    image: images/verify_names.jpg
    choices:
      - label: Ломиться в особняк за правдой
        next: mansion
        fail: hunted
        chance: [35, 65]
      - label: Зайти к анархам миром
        next: anarch_bar
      - label: Вернуться к сиру с полуправдой
        next: to_sire

  under_rehearsal:
    text: |-
      Нижняя репетиция. Без рампы. Список доменов проецируют на стену.
      Ваша кровь ещё не на подписи — но перо уже рядом. Шериф
      (если он ваш якорь) молчит в наушнике. Рената улыбается вживую.
    image: images/under_rehearsal.jpg
    choices:
      - label: Снять на скрытую камеру и уйти
        next: evidence_out
        fail: join_now
        chance: [40, 70]
      - label: Подписать и войти в заговор до конца
        next: join_now
      - label: Опрокинуть проектор и сорвать репетицию
        next: ending_breach

  lone_prince:
    text: |-
      Князь один в ложе — редкость, похожая на ловушку. Он слушает
      про гарпуна, флешку, перевёрнутый анкх. «Шабаш любит чужие
      печати. Камарилья — чужих детей. Что ты такое?»
    image: images/lone_prince.jpg
    choices:
      - label: Назвать себя верным двору
        next: ending_loyal_blade
      - label: Признать страх и просить защиты сиру тоже
        next: ending_pair_bond
      - label: Предложить себя ножом против списка
        next: ending_weapon

  anarch_bar:
    text: |-
      В «Чернильнице» после зачистки пахнет озоном и дешёвым вином.
      Анарх с тату-короной фыркает: «Камарилья гниёт. Мы не спасаем
      князя. Мы продаём лопаты тем, кто копает.» За барной стойкой —
      копия вашей флешки.
    image: images/anarch_bar.jpg
    choices:
      - label: Купить копию за услугу крови
        next: ending_anarch_deal
      - label: Убедить их ударить по заговору вместе
        next: evidence_out
        fail: ending_anarch_deal
        chance: [30, 60]
      - label: Разбить их копию и уйти
        next: verify_names

  mansion:
    text: |-
      В особняке пусто — и слишком чисто. На столе зеркало, в котором
      вас нет, и письмо: «Дитя, если читаешь — сир уже выбрала сторону.
      Выбери быстрее.» Подпись — один росчерк «Р.» и капля, пахнущая
      Эленой.
    image: images/mansion.jpg
    choices:
      - label: Верить письму и идти против сира
        next: sell_renata
      - label: Не верить и нести письмо князю
        next: private_prince
      - label: Сжечь письмо и вернуться к проверке
        next: verify_names

  nos_check:
    text: |-
      Носферату двора хрипит из вентиляции: «Файл настоящий.
      Рукоять — нет. Кто-то подмешал дату. Князя правда сдают…
      но не в ту ночь, что на экране.» Зал гудит. Время куплено.
    image: images/nos_check.jpg
    choices:
      - label: Просить мандат на нижнюю репетицию
        next: under_rehearsal
      - label: Отдать инициативу шерифу и отойти
        next: ending_small
      - label: Требовать ареста Ренаты сейчас
        next: harp_duel

  harp_duel:
    text: |-
      Гарпии обожают кровь, если она словесная. Вы бросаете в Ренату
      факты. Она бросает в вас возраст. Зал считает очки. Князь —
      долги.
    image: images/harp_duel.jpg
    choices:
      - label: Дожать и потребовать суда крови
        next: ending_blood_trial
        fail: ending_pawn
        chance: [40, 65]
      - label: Отступить с достоинством — оставить пятно на ней
        next: ending_stain
      - label: Свернуть дуэль и предложить ей частный мир
        next: sell_renata

  private_prince:
    text: |-
      За завесой ложи князь говорит без зрителей: «Я знаю про список.
      Мне нужно не доказательство. Мне нужен нож, которого не ждут.
      Сир твоя — в списке. Ты — нет. Вот твоя цена входа.»
    image: images/private_prince.jpg
    choices:
      - label: Отказаться поднимать руку на сира
        next: ending_pair_bond
      - label: Согласиться быть ножом двора
        next: ending_weapon
      - label: Согласиться — и предупредить Элену тайно
        next: ending_turn_soft
        fail: ending_weapon
        chance: [45, 75]

  evidence_out:
    text: |-
      Камера и копия списка у вас. Репетицию не сорвали — но теперь
      у улики есть зубы. Кому открыть пасть?
    image: images/evidence_out.jpg
    choices:
      - label: Князю на Элизиуме
        next: court_confession
      - label: Шерифу без зрителей
        next: ending_loyal_blade
      - label: Элене — и только ей
        next: ending_pair_bond

  join_now:
    text: |-
      Перо. Кровь. Подпись. Вы внутри. Список оживает: адреса гаснут
      на карте один за другим в будущих ночах. Вас гладят по волосам
      как ружьё.
    image: images/join_now.jpg
    choices:
      - label: Довести передачу доменов
        next: ending_coup_quiet
      - label: Слить координаты удара в последнюю секунду
        next: ending_turn_soft
        fail: ending_coup_quiet
        chance: [40, 70]
      - label: Вытащить Элену из списка ценой своей подписи
        next: ending_sacrifice

  ending_loyal_blade:
    text: |-
      Шериф и князь режут заговор по суставам. Вас не поднимают —
      вас затачивают. Новообращённый с флешкой становится тихим
      инструментом двора. Маскарад цел. Сон больше не про жажду —
      про списки.
    image: images/ending_loyal_blade.jpg
    choices: []

  ending_pair_bond:
    text: |-
      Вы не предаёте Элену. Она не предаёт вас — по крайней мере,
      эту неделю. Двор получает кусок правды, достаточный для охоты.
      Связь сира и дитя становится заговором из двоих. Иногда этого
      хватает, чтобы город не треснул.
    image: images/ending_pair_bond.jpg
    choices: []

  ending_weapon:
    text: |-
      Вы принимаете роль ножа. Элена исчезает из протоколов так же
      сухо, как гарпун из переулка. Князь доволен. Вы пьёте на его
      приёмах и не узнаёте вкус. Камарилья стоит на пепле, который
      вы подмели.
    image: images/ending_weapon.jpg
    choices: []

  ending_turn_soft:
    text: |-
      Предупреждение доходит. Удар сминается. Элена жива и в ярости.
      Князь получает половину триумфа и целую подозрительность к вам.
      Вы не герой. Вы человек (уже нет), который успел шепнуть вовремя.
    image: images/ending_turn_soft.jpg
    choices: []

  ending_coup_quiet:
    text: |-
      Домены уходят без сирен. Шабаш не орёт — подписывает. Камарилья
      города становится вывеской. Ваша подпись — мелкий шрифт внизу
      договора о конце эпохи. Рената присылает цветы в подвал.
    image: images/ending_coup_quiet.jpg
    choices: []

  ending_sacrifice:
    text: |-
      Имя Элены вычеркнуто. Ваше — вписано жирнее. Она уходит в рассвет
      чужого поезда. Вы остаётесь в машине заговора как плата за её
      билет. Маскарад не замечает обменов такого сорта.
    image: images/ending_sacrifice.jpg
    choices: []

  ending_breach:
    text: |-
      Проектор падает. Свет. Крики. Смертные охранники театра видят
      слишком много глаз без бликов. Зачистка жрёт ночь. Вас объявляют
      в крови. Заговор тоже. Победителей нет — только уборка.
    image: images/ending_breach.jpg
    choices: []

  ending_blood_trial:
    text: |-
      Суд крови. Рената не оправдывается — атакует. Вы стоите.
      Князь режет узел так, чтобы оба кровоточили: её статус и ваша
      безнаказанность. Урок Ночи: победа пахнет железом.
    image: images/ending_blood_trial.jpg
    choices: []

  ending_stain:
    text: |-
      Вы отступаете, оставив на Ренате пятно, которое гарпии не смоют
      месяцами. Флешка работает фоном. Иногда тихая месть надёжнее
      штурма нижней сцены.
    image: images/ending_stain.jpg
    choices: []

  ending_anarch_deal:
    text: |-
      Анархи дают копию и забирают услугу: одна ночь вашей крови
      на их войне. Камарилья остаётся с проблемой. Вы — с долгом
      и картой. Свобода тоже на цепи. Просто цепь короче и честнее.
    image: images/ending_anarch_deal.jpg
    choices: []

  ending_small:
    text: |-
      Вы отдаёте улику и становитесь сноской. Город бурлит без вас.
      Элена кивает: «Живой сноске проще пить.» Первая большая ночь
      проходит мимо — и это тоже выбор.
    image: images/ending_small.jpg
    choices: []

  ending_stripped:
    text: |-
      Флешку забирают. Вас отпускают голодным и пустым. На рассвете
      Элена встречает взглядом: «Без козыря ты снова просто дитя.»
      Заговор идёт по расписанию. Вы — нет.
    image: images/ending_stripped.jpg
    choices: []

  ending_blind:
    text: |-
      Осколки памяти. Список мёртв. Заговор жив — но вынужден щупать
      в темноте. Вас ненавидят все, кто любит файлы. Элена почти
      гордится. Князь — нет.
    image: images/ending_blind.jpg
    choices: []

  ending_flee:
    text: |-
      Задаток Ренаты греет карман. Город за спиной гаснет в зеркале.
      Вы не раскрыли заговор и не возглавили — вы вынули себя из пьесы.
      Жажда едет на соседнем сиденье.
    image: images/ending_flee.jpg
    choices: []

  ending_pawn:
    text: |-
      Подделка даты становится вашей виной. Двор смеётся красиво.
      Элену отводят в тень. Вас оставляют на свету как пример того,
      как нельзя носить флешки взрослым.
    image: images/ending_pawn.jpg
    choices: []

  ending_sire_wrath:
    text: |-
      Тайник пуст — и Элена это чувствует раньше князя. Наказание
      не в пепле: в отказе учить дальше. Вы свободны и беспомощны
      одновременно. Ночь огромна.
    image: images/ending_sire_wrath.jpg
    choices: []

  ending_double_dead:
    text: |-
      Рената узнаёт о доносе раньше князя. Вас находят в двух копиях
      слухов: предатель заговора и предатель двора. Пепел не выбирает
      формулировку.
    image: images/ending_double_dead.jpg
    choices: []

  ending_ash:
    text: |-
      Имя князя не спасает. Мелкий анкх вверх ногами — последняя вещь,
      которую вы видите. Список коротче на одну строку. Пьеса длиннее
      на один антракт.
    image: images/ending_ash.jpg
    choices: []
