title: Маскарад — Кровь на пороге (эхо)
vote_minutes: 60
start: wake
scenes:
  wake:
    text: |-
      Жажда та же. Подвал тот же. Элена наклоняется — и на миг в её
      зрачках вспыхивает чужой отсвет, будто кто-то смотрит изнутри.

      «Добро пожаловать в Ночь. Я Элена. Законы Камарильи ты выучишь.
      А вот законы тех, кто пишет письма к чужим гробам…» Она кивает
      на конверт с анкхом и царапиной. «Их ты выберешь сам. Или они
      выберут тебя дважды.»
    choices:
      - label: Спросить сира про конверт сразу
        next: ask_sire
      - label: Спрятать конверт и выйти в город одному
        next: street
        fail: street_hunger
        chance: [35, 65]
      - label: Вскрыть конверт при ней
        next: open_watched

  ask_sire:
    text: |-
      «Конверт мой, — неожиданно говорит Элена. — И не мой. Меня
      просили стать мостом. Я отказалась. Тогда они положили письмо
      к тебе.» В голосе нет стыда — только усталость веков.
      «Элизиум в театре. Князь ждёт пьесу. Нижняя сцена ждёт крови.
      Я буду наверху. Ты — там, куда ляжет твоя трусость или твоя злость.»
    choices:
      - label: Отнести конверт князю нечитанным
        next: prince_sealed
      - label: Прочитать тайком и решить потом
        next: read_alone
        fail: read_caught
        chance: [30, 60]
      - label: Отнести конверт тем, чей знак под анкхом
        next: conspirators

  open_watched:
    text: |-
      Текст иной на полбуквы: «Двор сгнил. Приведи сира живой —
      или принеси её верность в клочьях. — Р.» Элена хмыкает:
      «Рената не пишет „верность“. Пишет „пепел“. Это не она…
      или она уже не одна.»
    choices:
      - label: Идти с Эленой на Элизиум — предупредить князя
        next: elysium_warn
      - label: Идти на нижнюю сцену к «Р.»
        next: conspirators
      - label: Сделать вид, что не поняли, и раствориться в городе
        next: street

  street:
    text: |-
      Город звучит эхом чужих пульсов. На афише театра кто-то кровью
      дописал: «АНТРАКТ — НИЖНЯЯ СЦЕНА». Капля ещё влажная.
    choices:
      - label: Попытаться проскользнуть на Элизиум без сира
        next: elysium_sneak
        fail: elysium_denied
        chance: [40, 70]
      - label: Найти нижнюю сцену до полночи
        next: conspirators
      - label: Позвонить Элене и получить приказ
        next: ask_sire

  street_hunger:
    text: |-
      Срыв. Только на этот раз смертный смотрит вам вслед… и улыбается
      клыком. Не жертва — наблюдатель Шабаша. Конверт в кармане
      становится приманкой уже не для вас одних.
    choices:
      - label: Спрятать следы и идти в театр
        next: elysium_sneak
        fail: elysium_denied
        chance: [30, 55]
      - label: Признаться сиру в срыве
        next: confess_sire
      - label: Использовать хаос — бежать к «Р.»
        next: conspirators

  read_alone:
    text: |-
      Приписка кровью другая: «Элена уже внутри. Не доверяй сиру.
      Не доверяй „Р.“ Доверяй тому, кто боится света рампы.»
    choices:
      - label: Показать ей письмо и предложить вместе идти к князю
        next: elysium_warn
      - label: Скрыть текст и пойти к заговорщикам
        next: conspirators
      - label: Порвать письмо и выбрать только Маскарад — без сторон
        next: elysium_sneak

  read_caught:
    text: |-
      Элена читает приписку про себя — и смеётся тихо. «Вот теперь
      интересно. Иди вниз. Скажи, что я предательница. Посмотрим,
      кто поклонится лжи быстрее.»
    choices:
      - label: Согласиться быть приманкой
        next: bait
      - label: Отказаться и бежать к князю самому
        next: prince_sealed
        fail: street_hunger
        chance: [35, 65]
      - label: Отказаться и всё же идти к «Р.» честно
        next: conspirators

  confess_sire:
    text: |-
      Она слушает про Шабаш-наблюдателя внимательнее, чем про срыв.
      «Значит, снизу уже пахнет не Ренатой.» Конверт она возвращает
      вам. «Неси куда решишь. Я устала выбирать за детей.»
    choices:
      - label: Отдать конверт ей
        next: ask_sire
      - label: Настоять, что пойдёте к князю вместе
        next: elysium_warn
      - label: Уйти к нижней сцене, пока она занята судом
        next: conspirators

  prince_sealed:
    text: |-
      Князь вскрывает конверт сразу — в этой ночи у него нет терпения.
      Внутри пепел чужого письма и кольцо Элены. «Сир играет в обе
      стороны, — говорит он почти ласково. — Или кто-то хочет, чтобы
      я так решил. Докажи.»
    choices:
      - label: Назвать имя Ренаты вслух
        next: accuse_renata
        fail: accuse_fail
        chance: [30, 60]
      - label: Просить разрешения идти на нижнюю сцену шпионом двора
        next: bait_prince
      - label: Промолчать и встать за спиной сира
        next: elysium_warn

  elysium_sneak:
    text: |-
      В зале два шёпота с одной интонацией: сверху — про Маскарад,
      снизу — про его похороны. Эхо делает выбор громче.
    choices:
      - label: Предупредить князя шёпотом через слугу
        next: elysium_warn
        fail: elysium_denied
        chance: [40, 70]
      - label: Спуститься к шепоту
        next: conspirators
      - label: Найти Элену в зале
        next: ask_sire

  elysium_denied:
    text: |-
      Вас выставляют. На ступенях уже ждёт тореадор с нижней сцены —
      слишком вовремя, будто билет вам выписали заранее.
    choices:
      - label: Идти на нижнюю сцену
        next: conspirators
      - label: Ждать Элену снаружи
        next: confess_sire
      - label: Попытаться войти снова через служебный ход
        next: elysium_sneak
        fail: street_hunger
        chance: [25, 45]

  elysium_warn:
    text: |-
      Князь кивает. Элена кивает позже — на долю удара. Рената
      на балконе поднимает бокал за «честных детей». В этом эхе
      честность выглядит как яд.
    choices:
      - label: Спуститься как глаз Камарильи
        next: bait_prince
      - label: Отказаться — пусть идут шериф и гарпии
        next: ending_coward_court
      - label: Спуститься, но уже решив слушать заговорщиков всерьёз
        next: conspirators

  conspirators:
    text: |-
      Ренаты нет. Есть её голос из динамика и трое живых: носферату,
      тореадор и… человек в ошейнике с меткой Шабаша, которого держат
      как доказательство «сделки князя».

      «Камарилья уже продала вас, — шипит труба. — Мы просто хотим
      комиссию. Подпишись кровью — и сир останется жива. Откажись —
      и пепел будет парным.»
    choices:
      - label: Притвориться союзником и выведать план
        next: spy_plan
        fail: join_forced
        chance: [35, 65]
      - label: Честно встать на их сторону
        next: join_true
      - label: Отвергнуть и рвануть наверх к князю
        next: flee_up
        fail: join_forced
        chance: [30, 55]

  bait:
    text: |-
      Вы говорите, что Элена предательница — как просили. Заговорщики
      аплодируют тихо. «Значит, она наша, — делает вывод тореадор. —
      Или ты плохой актёр. Возьми кольцо. Отнеси князю. Пусть двор
      съест сам себя.»
    choices:
      - label: Взять конверт и отнести князю как «улику»
        next: false_evidence
      - label: Признать Элене, что вас раскрыли
        next: confess_sire
      - label: Перевернуться — правда служить «Р.»
        next: join_true

  bait_prince:
    text: |-
      Внизу вас встречают как ожидаемый реквизит. План тот же, но
      финал другой: вместо смерти шерифа — его подкуп. Князя оставляют
      на троне куклой. Город режут тише.
    choices:
      - label: Собрать имена и уйти наверх
        next: spy_plan
        fail: flee_up
        chance: [40, 70]
      - label: Остаться и принять их кровь клятвы
        next: join_true
      - label: Ударить первыми — сорвать сходку шумом
        next: ending_masquerade_break

  accuse_renata:
    text: |-
      Рената не смеётся — отсутствует. Обвинение повисает. Князь
      смотрит на Элену. «Интересный выбор имени, дитя. Почти удобный.»
    choices:
      - label: Настоять и идти с шерифом вниз
        next: bait_prince
      - label: Смягчиться и свалить тень на «подделку печати»
        next: ending_pawn
      - label: Тихо предложить Ренате сделку взглядом
        next: conspirators

  accuse_fail:
    text: |-
      Вас высмеивают изящно. Элена не защищает. На лестнице вниз
      вас уже ждут — будто провал был частью расписания.
    choices:
      - label: Идти к заговорщикам без легенды
        next: conspirators
      - label: Бежать из города до рассвета
        next: ending_flee
      - label: Умолять Элену вмешаться
        next: confess_sire

  spy_plan:
    text: |-
      Имена. Время. Подкуп шерифа. И строка: «Элена — куратор срыва».
      Правда это или чернила — решит, кому вы отдадите лист.
    choices:
      - label: Отдать всё князю
        next: ending_loyal
      - label: Отдать Элене и пусть она торгуется
        next: ending_sire_deal
      - label: Продать план обеим сторонам
        next: ending_double

  join_true:
    text: |-
      Клятва жжёт сильнее. В крови — чужой ритуал Шабаша, разбавленный
      этикетом. Вы внутри машины, которая хочет казаться Камарильей.
    choices:
      - label: В последний миг сорвать план изнутри
        next: ending_turncoat
        fail: ending_coup
        chance: [35, 65]
      - label: Довести заговор до конца
        next: ending_coup
      - label: Вывезти Элену из театра до удара
        next: ending_save_sire

  join_forced:
    text: |-
      Ошейник смертного-шабашита снимают и примеряют вам на шутку.
      Шутка держится на болтах.
    choices:
      - label: Дать клятву под давлением
        next: join_true
      - label: Кричать так, чтобы услышал Элизиум
        next: ending_masquerade_break
      - label: Ударить и бежать
        next: flee_up
        fail: ending_ash
        chance: [30, 55]

  flee_up:
    text: |-
      Вы выбегаете с кольцом Элены в кулаке — уликой, проклятием
      или ключом. Зал поворачивает головы синхронно.
    choices:
      - label: Выложить всё, что слышали
        next: ending_loyal
      - label: Выложить часть — и оставить рычаг себе
        next: ending_double
      - label: Потребовать защиту сиру прежде слов
        next: ending_sire_deal

  false_evidence:
    text: |-
      Князь смотрит на кольцо. Элена смотрит на вас. «Выбирай,
      чью смерть подписываешь,» — говорит князь почти весело.
    choices:
      - label: Признать подставу заговорщиков
        next: ending_loyal
        fail: ending_pawn
        chance: [35, 60]
      - label: Молчать и дать суду идти
        next: ending_pawn
      - label: Поддержать донос — отмежеваться от сира
        next: ending_coup

  ending_loyal:
    text: |-
      Двор чистит нижнюю сцену. Подкупленного шерифа меняют тихо.
      Вас благодарят холодно. Элена жива — и дальше от вас на шаг.
      Заговор был эхом большего. Вы заглушили только первый повтор.
    choices: []

  ending_sire_deal:
    text: |-
      Элена выкупает себя вашими словами и чужими долгами. Князь
      получает порт. Вы — метку «полезный шум». В Ночи этого хватает,
      чтобы пить не из луж.
    choices: []

  ending_double:
    text: |-
      Двусторонний профит тает быстрее крови на снегу. Вас оставляют
      как передатчик: все говорят через вас, никто не верит. Эхо
      собственной цены.
    choices: []

  ending_coup:
    text: |-
      Кукольный князь. Тихий раздел. Шабаш не врывается — входит
      в долю. Рената появляется только в конце, чтобы забрать аплодисменты,
      которых не заслуживала одна. Вы — в программке как «дитя реформ».
    choices: []

  ending_turncoat:
    text: |-
      Вы ломаете подкуп, возвращаете свет, сжигаете клятву в горле.
      Обе стороны называют вас клятвопреступником. Маскарад целее
      вашей репутации — обычный обмен.
    choices: []

  ending_save_sire:
    text: |-
      Элена обязана вам жизнью и злится именно поэтому. Город дрожит,
      но стоит. Она шепчет: «В следующий раз не спасай. В следующий
      раз выбирай.»
    choices: []

  ending_masquerade_break:
    text: |-
      Вспышки. Зачистка. В сводках — «театр, газ, паника». Охота
      объявлена на всех, кто кричал. Ваше имя — первое в списке,
      потому что молодое.
    choices: []

  ending_pawn:
    text: |-
      Элену не казнят — её делают невидимой. Вас — видимым и ручным.
      Конверт выполнил работу: отделил дитя от сира аккуратнее кола.
    choices: []

  ending_coward_court:
    text: |-
      Шериф возвращается с чужой победой. Вас не благодарят и не винят.
      Хуже: о вас забывают на час раньше, чем положено новообращённому.
    choices: []

  ending_flee:
    text: |-
      Дорога. Жажда. В зеркале заднего вида — тореадор, который не
      догоняет. Пока. Эхо города ещё дотянется.
    choices: []

  ending_ash:
    text: |-
      Пепел пахнет тем же подвалом, где вас Обняли. Круг замыкается
      без аплодисментов. Заговор продолжает репетицию без статиста.
    choices: []
