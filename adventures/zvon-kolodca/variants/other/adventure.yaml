title: Звон колодца (иной сказ)
vote_minutes: 60
start: dream
scenes:
  dream:
    text: |-
      Вам не присылали записок. Вас привели сюда сны.
      Три ночи подряд вы просыпаетесь с мокрыми ладонями и вкусом
      речной глины во рту. На четвёртую — уже стоите в Устьеве,
      хотя не помните дороги.

      Колодец на площади молчит… пока вы на него не смотрите.
      Тогда из глубины поднимается звон, будто он ждал взгляда.
      У сруба дети не играют. Они считают удары шепотом и сбиваются
      на седьмом.
    choices:
      - label: Бросить в колодец монету и загадать тишину
        next: coin
      - label: Украсть верёвку — пусть никто не спустится
        next: steal_rope
        fail: steal_caught
        chance: [35, 65]
      - label: Разбудить старосту и потребовать правды
        next: elder

  coin:
    text: |-
      Монета не плюхается — зависает над чёрной гладью, дрожит
      и растворяется в звоне. Из воды поднимается голос без горла:

      «Плату приняли. Вопрос — нет. Загадайте снова — или спуститесь
      за ответом, который нельзя загадать сверху.»
    choices:
      - label: Загадать имя того, кто должен успокоить воду
        next: name_wish
        fail: wrong_wish
        chance: [40, 70]
      - label: Спуститься за ответом
        next: under_hall
      - label: Отказаться от сделки и уйти к церкви
        next: church

  steal_rope:
    text: |-
      Верёвка тяжёлая от чужой сырости. Вы сматываете её — и площадь
      на миг глохнет. Дети перестают считать. Где-то внизу что-то
      бьётся о камень, будто лишилось лестницы.

      За спиной кашляет кузнец Гордей: «Умно. Жестоко. Теперь оно
      будет искать другой путь наверх — через сны. Через вас.»
    choices:
      - label: Сжечь верёвку в кузнице
        next: burn_rope
      - label: Вернуть верёвку и спуститься самому
        next: under_hall
      - label: Отнести верёвку в церковь
        next: church

  steal_caught:
    text: |-
      Страж хватает вас за локоть ещё на втором витке. «Вор колодца, —
      цедит он. — Староста велел таких будить лично.» Вас ведут
      не в клеть — к дому старосты. Верёвка остаётся на срубе,
      и звон смеётся коротко, как человек.
    choices:
      - label: Рассказать про сны начистоту
        next: elder
      - label: Молчать и ждать ошибки
        next: elder_silent

  elder:
    text: |-
      Староста не старый — выгоревший. На столе у него три крышки
      от колодцев соседних сёл: все треснули одинаково.
      «Правда простая, — говорит он. — Мы затопили монастырь.
      Теперь монастырь учится затопить нас. Мне нужен не герой.
      Мне нужен кто-то, кто согласится стать пробкой.»
    choices:
      - label: Согласиться быть «пробкой» на одну ночь
        next: plug_night
        fail: plug_fail
        chance: [45, 75]
      - label: Отказаться и искать Лиру — ту, что пишет записки
        next: find_lira
      - label: Потребовать спуска с охраной
        next: under_guard

  elder_silent:
    text: |-
      Молчание вас не спасает. Староста кивает стражу: «К колодцу.
      Пусть посмотрит. Кто молчит во сне — тот уже выбран.»
      Вас ставят на край. Верёвка касается ладони сама.
    choices:
      - label: Спуститься
        next: under_hall
      - label: Вырваться и бежать к церкви
        next: church
        fail: under_hall
        chance: [30, 55]

  name_wish:
    text: |-
      Вода отвечает именем: «Мирослава.» Звон на миг становится
      мелодией — почти молитвой. Но монета уже растворена: плата
      требует тела. Голос добавляет: «Имя дано. Носитель — нет.»
    choices:
      - label: Предложить себя носителем
        next: plug_night
      - label: Спуститься и найти другого носителя
        next: under_hall
      - label: Отдать имя священнику
        next: church

  wrong_wish:
    text: |-
      Вы загадываете имя — и вода возвращает чужое: ваше.
      Звон теперь зовёт вас лично. Люди на площади отводят глаза.
      «Поздравляю, — бормочет Гордей из темноты. — Вы стали вопросом.»
    choices:
      - label: Спуститься, пока зов не стал приказом
        next: under_hall
      - label: Просить церковь снять имя
        next: church

  find_lira:
    text: |-
      Лира сидит не в трактире — на крыше трактира, ногами в пустоту.
      «Записки писала я, — говорит она. — Чтобы найти не храбреца,
      а того, кто уже мокрый во сне. Вы подходите.» Она кидает вам
      камышовый перстень. «Это не ключ. Это якорь. Не перепутайте.»
    choices:
      - label: Надеть перстень и спуститься
        next: under_anchor
      - label: Отдать перстень старосте
        next: elder
      - label: "Предложить Лире сделку: она якорь, вы — руки"
        next: deal_lira
        fail: deal_broken
        chance: [40, 70]

  deal_lira:
    text: |-
      Сделка держится. Лира остаётся наверху с нитью на запястье —
      другим концом нить уходит вам под кожу, без крови, как обещание.
      Внизу вы не одни: её голос идёт по нити и подсказывает шаги.
    choices:
      - label: Идти к чаше по её словам
        next: under_anchor
      - label: Отрезать нить — не хочу долгов
        next: under_hall

  deal_broken:
    text: |-
      Лира смеётся коротко. «Руки без якоря — это просто утопленник
      с амбициями.» Перстень она оставляет себе. Вас отпускают
      к колодцу без подсказки — только со звоном в зубах.
    choices:
      - label: Спуститься всё равно
        next: under_hall
      - label: Вернуться к старосте
        next: elder

  church:
    text: |-
      В церкви пахнет воском и сыростью, которой не должно быть
      на холме. Никодим не удивлён. «Сны — это уже служба, —
      говорит он. — Могу дать крест. Не могу дать отпущение:
      монастырь не наш должник. Мы — его.»
    choices:
      - label: Взять крест и спуститься
        next: under_cross
      - label: Остаться молиться до рассвета
        next: ending_pray
      - label: Вытащить Никодима к колодцу силой слов
        next: under_guard
        fail: ending_pray
        chance: [35, 60]

  burn_rope:
    text: |-
      Верёвка горит зелёным. В огне слышен женский вздох — не боль,
      а облегчение. Наутро колодец тих. К вечеру звон возвращается
      из колодцев соседних сёл: беда просто сменила адрес.
    choices:
      - label: Ехать по следу звона
        next: ending_hunt
      - label: Остаться и стеречь Устьево
        next: ending_watch

  plug_night:
    text: |-
      Вас сажают на крышку колодца до рассвета — живой пробкой.
      Звон бьётся в позвоночник. Иногда хочется встать. Иногда —
      нырнуть. На востоке светлеет. Вода снизу утихает, будто
      признаёт: эту ночь вы выиграли телом, не именем.
    choices: []

  plug_fail:
    text: |-
      К середине ночи ноги сами делают шаг в пустоту. Пробка
      не выдерживает. Вас нет на крышке к рассвету. Зато звон
      на площади на миг становится похож на ваше дыхание во сне —
      и соседи начинают просыпаться мокрыми.
    choices: []

  under_guard:
    text: |-
      Стражи спускаются с вами — трое. До чаши доходит один:
      двое остаются в эхе арок, повторяя одни и те же шаги.
      Чаша предлагает выбор без свидетелей.
    choices:
      - label: Произнести имя Мирославы
        next: ending_name
      - label: Разбить чашу крестом стража
        next: ending_break
        fail: ending_flood
        chance: [40, 65]
      - label: Вытолкнуть стража к чаше вместо себя
        next: ending_coward

  under_hall:
    text: |-
      Зал. Стёртые лица. Чаша. Никаких записок — только вода,
      которая знает ваше имя лучше вас.
    choices:
      - label: Отдать воде своё имя добровольно
        next: ending_taken
      - label: Выторговать чужое — Мирославу
        next: ending_name
        fail: ending_taken
        chance: [45, 70]
      - label: Молча развернуться и лезть наверх
        next: ending_watch

  under_anchor:
    text: |-
      Перстень тянет к чаше, как грузило. Вода узнаёт якорь и смиряется
      быстрее, чем злость. Вы говорите не имя — согласие: «Довольно.»
      Звон гаснет. Наверху Лира дёргает нить — вы живы.
    choices: []

  under_cross:
    text: |-
      Крест шипит в воде. Чаша не гаснет — она меняет тон: из звона
      в похоронный. Вы поднимаетесь с пониманием: церковь купила
      Устьеву не тишину, а отсрочку до следующей осени.
    choices: []

  ending_name:
    text: |-
      Имя ложится на воду правильно. Монастырь выдыхает. Устьево
      остаётся на карте. Вы просыпаетесь в своей постели — наконец —
      с сухими ладонями. Снов больше нет. Памяти о цене — слишком много.
    choices: []

  ending_break:
    text: |-
      Чаша лопается. Осколки поют и смолкают. Наверху колодец
      становится ямой с обычной водой. Стражи называют вас святым.
      Никодим — нет. Он знает: разбитое легче затопить заново.
    choices: []

  ending_flood:
    text: |-
      Удар по чаше будит всё, что спало под ладаном. Вода идёт вверх
      быстрее молитвы. Устьево исчезает до петухов. Ваш сон на этом
      заканчивается — вместе с деревней.
    choices: []

  ending_taken:
    text: |-
      Вода принимает ваше имя как инвентарь. Вы больше не снитесь себе.
      Зато каждое утро снитесь Устьеву — мокрой приметой у сруба.
    choices: []

  ending_coward:
    text: |-
      Страж касается чаши и остаётся там улыбкой на воде. Вас поднимают
      героем. Ночью вы слышите его шаг в своём доме — на секунду позже
      вашего. Эхо долга.
    choices: []

  ending_pray:
    text: |-
      Рассвет застаёт вас на коленях. Звон слабее. Не исчез.
      Никодим кладёт руку на плечо: «Иногда служба — это не победа.
      Это очередь.» Устьево живёт ещё день. Потом будет видно.
    choices: []

  ending_hunt:
    text: |-
      Вы едете по следу звона от села к селу. Где-то его глушат.
      Где-то встречают хлебом. История больше не про одну площадь —
      про дорогу, на которой вода учится чужим именам.
    choices: []

  ending_watch:
    text: |-
      Вы остаётесь. Ночи тихие ровно до тех пор, пока вы не смыкаете
      глаза. Тогда колодец работает во сне — и Устьево всё же спит
      благодаря тому, что вы не спите до конца.
    choices: []
