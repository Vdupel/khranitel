title: Звон колодца (эхо)
vote_minutes: 60
start: square
scenes:
  square:
    text: |-
      В Устьеве три ночи подряд звонит колодец на площади.
      Только в этой ночи звон словно отвечает сам себе: удар — и эхо
      из-под земли чуть позже, чужим тембром. Староста уже не запирает
      ставни — он их выломал, чтобы «лучше слышать, откуда беда».

      На доске у кузницы та же записка, но чернила свежие, будто
      писали час назад: «Кто слышит эхо — тот уже внутри. Придите.»

      В колоде — не луна, а второй колодец, опрокинутый вглубь.
      Трактир светится. У колокольни — лампа, и тень священника
      стоит неправильно: будто у лампы два хозяина.
    image: images/square.jpg
    choices:
      - label: Заглянуть в колодец
        next: look_in
      - label: Спросить священника у колокольни
        next: priest
      - label: Спросить в трактире, кто писал записку
        next: tavern

  look_in:
    text: |-
      Край сырой. В отражении — ваше лицо… и чужое под ним, женское,
      с глазами цвета камыша. Губы шевелятся: «Имя уже произнесли.
      Теперь нужен тот, кто согласится его носить.»

      Верёвка уходит вниз. На ней мокрые следы ладоней — свежие.
      Кто-то спускался этой ночью и не вернулся.
    image: images/look_in.jpg
    choices:
      - label: Спуститься по верёвке
        next: descend
        fail: rope_echo
        chance: [35, 65]
      - label: Отойти и искать священника
        next: priest
      - label: Пойти в трактир за советом
        next: tavern

  rope_echo:
    text: |-
      Верёвка дёргается сама — будто снизу тянут. Вы срываетесь
      не до дна, а в боковой пролом: узкий ход, полный эха вашего
      же дыхания. Выползаете обратно на площадь… но площадь пуста,
      окна темны, а колодец звенит уже над вами, из воздуха.
    image: images/rope_echo.jpg
    choices:
      - label: Бежать к колокольне
        next: priest
      - label: Ломиться в трактир
        next: tavern
      - label: Снова к колодцу — иначе
        next: look_in

  priest:
    text: |-
      Отец Никодим курит. Рядом с ним — второй Никодим из тумана,
      без трубки, с мокрыми рукавами. Живой кивает на двойника:

      «Эхо монастыря. Он помнит меня молодым. Крест я всё ещё отдам,
      но имя… имя теперь знает вода. Кузнец врёт от страха. А женщина
      в трактире — не врёт. Она просто не вся здесь.»
    image: images/priest.jpg
    choices:
      - label: Взять крест и идти к кузнецу
        next: smith
      - label: Отказаться от креста, искать автора записки
        next: tavern
      - label: Вернуться к колодцу с крестом
        next: look_with_cross

  tavern:
    text: |-
      В «Трёх вёслах» у очага две Лиры. Одна пишет. Вторая смотрит
      на вас так, будто вы уже были. Пишущая говорит спокойно:

      «Меня зовут Лира. Точнее — ту, что осталась наверху. Имя
      настоятельницы — Мирослава. Произнесите его внизу — и эхо
      схлопнется в одну глотку. Произнесите плохо — и Устьево
      начнёт повторять само себя, пока не сотрётся.»
    image: images/tavern.jpg
    choices:
      - label: Поверить Лире и спуститься с именем
        next: descend_named
        fail: name_splits
        chance: [30, 60]
      - label: Не верить — идти к священнику
        next: priest
      - label: Предложить Лире спуститься вместе
        next: descend_with_lira

  name_splits:
    text: |-
      У чаши имя распадается на слоги. Вода повторяет «Ми… ро…»
      и не собирает слово. Звон становится двухголосым. Вы поднимаетесь
      с полузнакомым лицом в отражении каждой лужи на площади.
    image: images/name_splits.jpg
    choices:
      - label: Искать кузнеца — может, он знает полное
        next: smith
      - label: Вернуться к Лире за другим тоном
        next: tavern
      - label: Коснуться чаши, пока имя не целое
        next: ending_taken

  smith:
    text: |-
      Гордей куёт одну и ту же подкову снова и снова — каждый удар
      чуть тише предыдущего, будто молот тоже эхо. «Мирослава, —
      говорит он. — В этой ночи имя дешёвое. Дорогое — согласие
      остаться вместо неё. Крест удерживает не тень. Он удерживает
      вас от того, чтобы стать вторым звоном.»
    image: images/smith.jpg
    choices:
      - label: Спуститься с именем и крестом
        next: descend_armed
        fail: cross_rings
        chance: [40, 75]
      - label: Спуститься только с именем
        next: descend_named
      - label: Отдать крест обратно и уйти из Устьева
        next: leave_coward

  cross_rings:
    text: |-
      Крест на дне звенит сам — тонко, предательски, в унисон с колодцем.
      Имя тонет в этом дуэте. Вы выходите без перстня, зато с дрожью
      в зубах: Устьево теперь слышит вас на любой площади.
    image: images/cross_rings.jpg
    choices:
      - label: Отдать дрожь старосте как предупреждение
        next: ending_peace
      - label: Унести её с собой
        next: ending_keep

  look_with_cross:
    text: |-
      Крест касается камня — и эхо на миг опаздывает. В воде лицо
      Мирославы кивает на колокольню: «Там двое. Слушай живого.»
      Верёвка не натягивается сама — она дрожит, как струна.
    image: images/look_with_cross.jpg
    choices:
      - label: Спуститься с крестом
        next: descend_cross
      - label: Сначала узнать имя у кузнеца
        next: smith

  descend:
    text: |-
      Зал монастыря удвоен: каждая арка имеет бледную копию глубже.
      Чаша одна. Голос без горла говорит уже вашим тембром:

      «Имя. Или кровь. Или станьте эхом — и звоните вместо нас.»
    image: images/descend.jpg
    choices:
      - label: Коснуться чаши без слова
        next: ending_taken
      - label: Подняться обратно за знанием
        next: square_return
      - label: Предложить свою кровь вместо имени
        next: ending_blood

  descend_named:
    text: |-
      Вы говорите: «Мирослава.» Эхо пытается ответить — и срывается.
      Вода в чаше складывается в одну ноту и гаснет. Наверху петухи
      кричат дважды: сначала живо, потом — как из бочки.

      Устьево засыпает. Но во сне староста всё равно слышит тихий
      второй удар — уже без беды, просто память.
    image: images/descend_named.jpg
    choices: []

  descend_with_lira:
    text: |-
      С вами спускается только одна Лира. Вторая остаётся у очага
      и машет, будто прощается навсегда. У чаши живая шепчет:

      «Если скажу имя — исчезнет она. Если кровь — исчезну я.
      Выбирайте, кого Устьево потеряет.»
    image: images/descend_with_lira.jpg
    choices:
      - label: Настоять, чтобы Лира произнесла имя
        next: ending_lira_name
        fail: ending_door
        chance: [40, 70]
      - label: Остановить её и произнести имя самому
        next: descend_named
      - label: Позволить ей выбрать кровь
        next: ending_door

  descend_armed:
    text: |-
      Крест и имя режут эхо, как нож — петлю. Песня кончается один раз,
      без повтора. В чаше — перстень, но камыш на нём растёт внутрь,
      к кости пальца. На площади один Никодим. Одна Лира. Гордей
      наконец кладёт молот.
    image: images/descend_armed.jpg
    choices:
      - label: Отдать перстень старосте
        next: ending_peace
      - label: Оставить перстень себе
        next: ending_keep

  descend_cross:
    text: |-
      Без имени крест глушит только верхний голос. Нижний — эхо —
      остаётся. Никодим бледнеет: «Значит, живой колокол ещё внизу.
      Имя. Или уходите, пока площадь не выучила вашу походку.»
    image: images/descend_cross.jpg
    choices:
      - label: К кузнецу за именем
        next: smith
      - label: В трактир к Лире
        next: tavern

  square_return:
    text: |-
      Площадь повторяет ваш приход на минуту позже: тень догоняет тело.
      Звон тоже с задержкой. Времени до двенадцатого удара меньше,
      чем кажется часам.
    image: images/square_return.jpg
    choices:
      - label: К священнику
        next: priest
      - label: В трактир
        next: tavern
      - label: К кузнецу
        next: smith

  ending_taken:
    text: |-
      Вода берёт вас мягко. Вы не тонете — вас ставят на повтор.
      Отныне каждый, кто заглянет в колодец, на миг увидит ваше лицо
      под луной — и услышит, как вы учите новый удар звона.
    image: images/ending_taken.jpg
    choices: []

  ending_blood:
    text: |-
      Кровь падает — и эхо площади отвечает потопом дважды.
      Устьево уходит под воду сначала по-настоящему, потом — во сне
      соседних сёл, пока память о нём не размажется в слух.
    image: images/ending_blood.jpg
    choices: []

  ending_lira_name:
    text: |-
      Лира у чаши произносит имя — и гаснет та, что у очага.
      Наверху пустой стул. Живая плачет беззвучно: «Спасибо.
      Теперь я одна. Это честнее.» Колодец молчит. Записка больше
      не появляется — некому писать второй раз.
    image: images/ending_lira_name.jpg
    choices: []

  ending_door:
    text: |-
      Кровь Лиры открывает не свет, а коридор из эх: шаги, голоса,
      чужие площади. Она уходит туда, где каждый звук имеет пару.
      Колодец в Устьеве замолкает. Зато в трёх соседних деревнях
      наутро впервые звякает вода.
    image: images/ending_door.jpg
    choices: []

  ending_peace:
    text: |-
      Староста кладёт перстень под стекло — и просит забить колодец
      крышкой «на всякий». Дети снова играют, но далеко от сруба.
      Тишина настоящая, без второго удара. Иногда этого довольно.
    image: images/ending_peace.jpg
    choices: []

  ending_keep:
    text: |-
      Перстень на пальце иногда отвечает на чужие колокола — тише,
      личнее. Устьево спасено. Вы уносите эхо с собой, как шрам,
      который слышно только вам.
    image: images/ending_keep.jpg
    choices: []

  leave_coward:
    text: |-
      Вы уходите. За спиной Устьево учится повторять само себя:
      одни и те же дни, один и тот же звон, одни и те же лица у колодца.
      Через месяц на карте деревня ещё есть. В разговорах — уже нет.
    image: images/leave_coward.jpg
    choices: []
