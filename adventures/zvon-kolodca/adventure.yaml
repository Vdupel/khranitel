title: Звон колодца
vote_minutes: 60
start: square
scenes:
  square:
    text: |-
      В Устьеве три ночи подряд звонит колодец на площади.
      Не ведро о камень — тонкий, как от колокольчика в склепе.
      Староста запирает ставни раньше срока. Дети не играют у сруба.
      К полуночи из воды поднимается пар, хотя осень сухая.

      На доске у кузницы — записка чужим почерком: «Кто слышит звон —
      тот уже позван. Придите на площадь до двенадцатого удара.»

      Вы стоите у каменного круга. В колоде — луна, и под ней что-то
      шевелится, будто рыба под льдом. За спиной — тёплый свет трактира.
      В тени колокольни мерцает лампа священника.
    choices:
      - label: Заглянуть в колодец
        next: look_in
      - label: Спросить священника у колокольни
        next: priest
      - label: Спросить в трактире, кто писал записку
        next: tavern

  look_in:
    text: |-
      Вы опираетесь на сырой край. Звон идёт не сверху — из глубины,
      будто кто-то бьёт серебряным молотком по дну мира.
      В отражении луны мелькает лицо: не ваше. Женское. Губы шевелятся
      беззвучно, и вы всё равно понимаете: «Спуститесь. Ключ у того,
      кто помнит имя.»

      Верёвка спускается в черноту дальше, чем должен быть уровень воды.
      Пахнет мокрой глиной и старым ладаном. С площади слышен смешок —
      или эхо.
    choices:
      - label: Спуститься по верёвке
        next: descend
      - label: Отойти и искать священника
        next: priest
      - label: Пойти в трактир за советом
        next: tavern

  priest:
    text: |-
      Отец Никодим курит трубку под стрехами, будто мороз его не берёт.
      «Звон — не чудо и не беда сама по себе, — говорит он. — Это память.
      До Устьева здесь стоял монастырь. Его затопили нарочно, когда
      братия начала слушать воду вместо Бога.»

      Он достаёт из рукава бронзовый крест с потёртой надписью.
      «Имя настоятельницы выскоблили из книг. Кто произнесёт его внизу —
      либо закроет колодец, либо откроет то, что лучше не будить.
      Крест я отдам. Имя — нет. Его знает только старый кузнец…
      или тот, кто оставил записку.»
    choices:
      - label: Взять крест и идти к кузнецу
        next: smith
      - label: Отказаться от креста, искать автора записки
        next: tavern
      - label: Вернуться к колодцу с крестом
        next: look_with_cross

  tavern:
    text: |-
      В «Трёх вёслах» пахнет пивом и мокрым сукном. У очага — женщина
      в дорожном плаще, капюшон наброшен низко. На столе перед ней —
      вторая перчатка к той, что лежит у колодца? Нет: перчатки нет.
      Есть чернильница и обрывки той же бумаги.

      «Я не звала вас, — говорит она спокойно. — Я предупредила.
      Меня зовут Лира. Моя бабка была последней, кто видел монастырь
      до затопления. Имя настоятельницы — Мирослава. Произнесите его
      внизу с чистым намерением — и звон утихнет. Произнесите из жадности —
      и вода заберёт площадь.»

      Хозяин трактира качает головой: «Она каждый вечер одно и то же.»
    choices:
      - label: Поверить Лире и спуститься с именем
        next: descend_named
      - label: Не верить — идти к священнику
        next: priest
      - label: Предложить Лире спуститься вместе
        next: descend_with_lira

  smith:
    text: |-
      Кузница ещё теплая. Старик Гордей не поднимает глаз от наковальни.
      «Мирослава, — говорит он раньше, чем вы спрашиваете. — Так звали ту,
      что пела над водой. Я был мальчишкой. Она не была ведьмой.
      Она прятала людей, когда князь жёг инакомыслящих. Монастырь
      затопили не за ересь — за то, что свидетели неудобны.»

      Он кивает на крест в вашей руке: «Никодим добрый, но трус.
      Крест удержит тень на один удар сердца. Имя — на три.
      Дальше решаете вы.»

      Снаружи колодец звенит громче. Пора.
    choices:
      - label: Спуститься с именем и крестом
        next: descend_armed
      - label: Спуститься только с именем
        next: descend_named
      - label: Отдать крест обратно и уйти из Устьева
        next: leave_coward

  look_with_cross:
    text: |-
      Крест касается камня — и звон на миг обрывается, будто кто-то
      зажал струну. В воде лицо Мирославы становится яснее: глаза
      не злые, усталые. Она указывает вниз, потом — на вас, потом —
      на колокольню, будто просит не верить только одним устам.

      Верёвка натягивается сама. Крест в ладони теплеет.
    choices:
      - label: Спуститься с крестом
        next: descend_cross
      - label: Сначала узнать имя у кузнеца
        next: smith

  descend:
    text: |-
      Холод обнимает сразу. Камни скользкие, воздух густой, как перед
      грозой в погребе. Внизу — не дно, а зал: арки уходят в темноту,
      на стенах — стёртые фрески святых с выскобленными лицами.

      Звон теперь рядом. В центре зала — чаша из чёрного камня.
      В ней вода стоит выше краёв и не проливается. Голос без горла:

      «Имя. Или кровь. Или уйдите и слушайте звон до конца дней.»
    choices:
      - label: Коснуться чаши без слова
        next: ending_taken
      - label: Подняться обратно за знанием
        next: square_return
      - label: Предложить свою кровь вместо имени
        next: ending_blood

  descend_named:
    text: |-
      Вы спускаетесь, держа на языке имя, как уголёк. Зал монастыря
      встречает вас запахом ладана и речной тины. Чаша в центре
      дрожит — вода хочет выйти.

      Вы говорите: «Мирослава.»

      Звон складывается в одну чистую ноту и гаснет. Фрески на миг
      обретают лица — женщина с короной из камыша кивает вам.
      Вода в чаше опадает. Где-то наверху кричат петухи, хотя до утра
      ещё далеко.

      Устьево будет спать. А вы — помнить, как звучит тишина после чуда.
    choices: []

  descend_with_lira:
    text: |-
      Лира идёт первой. На дне она не удивляется залу — будто бывала.
      У чаши она становится на колени.

      «Бабушка лгала не во всём, — шепчет Лира. — Имя закрывает звон.
      Но кровь открывает дверь, которой Мирослава боялась больше воды.»

      Она смотрит на вас: «Решайте. Я могу сказать имя. Могу — нет.»
    choices:
      - label: Настоять, чтобы Лира произнесла имя
        next: ending_lira_name
      - label: Остановить её и произнести имя самому
        next: descend_named
      - label: Позволить ей выбрать кровь
        next: ending_door

  descend_armed:
    text: |-
      Крест и имя — два ключа в одной ладони. В зале тени жмутся
      к стенам, словно животные от огня. Вы поднимаете крест над чашей
      и говорите: «Мирослава. Мир тебе. Устьево тебя помнит.»

      Вода вспыхивает серебром. Из чаши поднимается не чудовище —
      тонкий звон, который становится песней. Песня кончается.
      На дне чаши остаётся бронзовый перстень с камышовым узором.

      Когда вы выходите на площадь, священник крестится, кузнец молчит,
      а Лира в трактире улыбается так, будто долг закрыт.
      Перстень можно отдать Устьеву — или оставить себе.
    choices:
      - label: Отдать перстень старосте
        next: ending_peace
      - label: Оставить перстень себе
        next: ending_keep

  descend_cross:
    text: |-
      Крест светится слабо, как уголёк под золой. Без имени его силы
      хватает ровно на то, чтобы тени не коснулись вас у чаши.
      Вода шипит. Голос требует имя — и не получает.

      Вы поднимаетесь, пока крест не остыл. На площади звон тише,
      но не исчез. Никодим бледнеет: «Значит, одного креста мало.
      Идите к Гордею. Или к той, что пишет записки. Пока есть ночь.»
    choices:
      - label: К кузнецу за именем
        next: smith
      - label: В трактир к Лире
        next: tavern

  square_return:
    text: |-
      Площадь та же, но окна уже тёмные. Звон следует за вами, как
      навязчивый мотив. У вас есть время до следующего двенадцатого
      удара — и меньше уверенности, чем час назад.
    choices:
      - label: К священнику
        next: priest
      - label: В трактир
        next: tavern
      - label: К кузнецу
        next: smith

  ending_taken:
    text: |-
      Вода принимает ладонь ласково. Холод становится теплом, тепло —
      сном. Вы слышите, как Устьево продолжает жить над вами: шаги,
      споры, смех. А сами становитесь частью звона — тонкой нотой
      в колоде, которая отныне зовёт следующих.

      Приключение окончено. Колодец помнит вас по имени, которого
      вы так и не узнали.
    choices: []

  ending_blood:
    text: |-
      Капля падает в чашу. Вода чернеет. Арки дрожат. Сверху —
      крик: площадь уходит под волну, которой неоткуда взяться
      в сухую осень. Вы успеваете подумать, что звон наконец стал
      тише — потому что слушать его больше некому.

      К утру Устьево — озеро с торчащей колокольней. Вас не находят.
    choices: []

  ending_lira_name:
    text: |-
      Лира произносит имя ровно, без дрожи. Звон гаснет. Она плачет
      без звука — и поднимается вместе с вами. На площади рассвет
      серый, обычный, драгоценный.

      «Спасибо, что не дали мне выбрать худшее», — говорит она.
      Колодец молчит. Записка на кузне больше не появляется.
    choices: []

  ending_door:
    text: |-
      Лира режет ладонь над чашей. Вода встаёт стеной и расступается —
      за ней коридор из света, где нет ни монастыря, ни Устьева.
      Она шагает внутрь, не оглядываясь.

      Звон прекращается. Колодец становится просто колодцем.
      Но по ночам из него иногда тянет запахом чужого моря, и дети
      рассказывают, что видели женщину в капюшоне, которая машет
      с той стороны воды.

      Вы закрыли одно. Открыли другое.
    choices: []

  ending_peace:
    text: |-
      Староста принимает перстень как святыню — дрожащими руками,
      без речей. Его кладут в церковь под стекло. Звон не возвращается.
      В Устьеве снова играют у сруба. Никодим служит благодарственный
      молебен. Гордей куёт подкову «на удачу путникам».

      Ваше имя не попадёт в летопись. Зато площадь дышит спокойно —
      и этого довольно для хорошего конца.
    choices: []

  ending_keep:
    text: |-
      Перстень холодит палец, будто помнит воду. Устьево спасено,
      но во сне вам иногда слышен тот же звон — тише, личнее.
      Дорога уводит дальше. Где бы вы ни остановились у колодца,
      вода на миг отражает камыш и лицо женщины, которая кивает:
      долг закрыт, но связь осталась.

      Приключение окончено. История — нет.
    choices: []

  leave_coward:
    text: |-
      Вы оставляете крест на наковальне и уходите до рассвета.
      За спиной Устьево продолжает слушать звон. Может, найдётся
      другой. Может — нет.

      Через неделю в соседнем селе расскажут, что площадь ушла под воду.
      Вы будете пить в другом трактире и делать вид, что не узнаёте
      мотив, который напевает пьяница у очага.
    choices: []
