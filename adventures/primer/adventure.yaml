title: Перекрёсток у старого дуба
vote_minutes: 2
start: crossroads
scenes:
  crossroads:
    text: |-
      Ночь, старый дуб и три дороги. Костёр уже кем-то разведён,
      на камне лежит чужая перчатка с вышитым львом.
    image: images/crossroads.jpg
    choices:
      - label: Свернуть в лес
        next: forest
        fail: forest_lost
        chance: [45, 75]
      - label: Идти к огням деревни
        next: village
      - label: Ждать у костра
        next: camp
  forest:
    text: |-
      Тропа выводит к волку. Он сидит посреди дороги и не скалится.
      На шее — обрывок той же перчатки.
    image: images/forest.jpg
    choices:
      - label: Заговорить
        next: talk
        fail: talk_snarl
        chance: [35, 65]
      - label: Обойти лесом
        next: around
  forest_lost:
    text: |-
      Чаща смыкается раньше, чем вы замечаете. К утру тропа выводит
      не к волку — к опушке у деревни, а перчатка так и осталась у дуба.
    image: images/around.jpg
    choices: []
  village:
    text: |-
      В деревне не спят. На площади рыцарь без перчатки ищет того,
      кто подберёт вторую. Он кивает вам на свободное место у стола.
    image: images/village.jpg
    choices: []
  camp:
    text: |-
      К костру выходит хозяин перчатки сам. До утра он рассказывает,
      куда ведут все три дороги, и просит проводить его в деревню.
    image: images/camp.jpg
    choices:
      - label: Проводить в деревню
        next: village
        fail: camp_parting
        chance: [40, 70]
      - label: Отказаться и уйти в лес
        next: forest
  camp_parting:
    text: |-
      По дороге рыцарь замолкает и сворачивает один. «Дальше мне
      нельзя с проводником,» — бросает он. Вы доходите до огней вдвоём
      с собственной тенью; за столом вас ждут без него.
    image: images/village.jpg
    choices: []
  talk:
    text: |-
      Волк говорит человеческим голосом: перчатку украли не вы.
      Он провожает вас до опушки и исчезает, оставив её у ног.
    image: images/talk.jpg
    choices: []
  talk_snarl:
    text: |-
      Волк рычит — не словами. Вы пятитесь, спотыкаетесь, и лес
      сам выталкивает вас к деревенской дороге. Перчатка остаётся у него.
    image: images/around.jpg
    choices: []
  around:
    text: |-
      Обход длинный. К утру вы выходите к той же деревне,
      а волк так и сидит на тропе за спиной.
    image: images/around.jpg
    choices: []
