title: Перекрёсток у старого дуба (иная версия)
vote_minutes: 2
start: crossroads
scenes:
  crossroads:
    text: |-
      Та же ночь, тот же дуб — но перчатки на камне нет.
      Вместо неё лежит тусклый медальон с треснувшим львом.
      Три дороги всё так же ждут, только ветер дует с другой стороны.
    choices:
      - label: Свернуть в лес
        next: forest
      - label: Идти к огням деревни
        next: village
        fail: village_asleep
        chance: [30, 60]
      - label: Ждать у костра
        next: camp
  forest:
    text: |-
      На тропе не волк, а женщина в плаще. Медальон на её шее цел.
      «Ты видел треснувший? — спрашивает она. — Его подбросили.»
    choices:
      - label: Отдать медальон
        next: talk
        fail: talk_refuse
        chance: [40, 80]
      - label: Обойти молча
        next: around
  village:
    text: |-
      В деревне спят. Лишь один страж у ворот шепчет, что рыцарь
      уехал на рассвете — искать целый медальон, не перчатку.
    choices: []
  village_asleep:
    text: |-
      Вы сбиваетесь с огней и выходите к пустым воротам уже за полночь.
      Страж спит. Рыцаря нет. Медальон в кармане холодеет, будто
      история обошла вас стороной.
    choices: []
  camp:
    text: |-
      К костру выходит та же женщина. До утра она молчит,
      а на прощание меняет ваш треснувший медальон на целый.
    choices:
      - label: Принять обмен
        next: village
        fail: camp_broken
        chance: [35, 55]
      - label: Отказаться и уйти в лес
        next: forest
  camp_broken:
    text: |-
      При обмене целый медальон трескается у вас в пальцах —
      та же трещина, что была на старом. Женщина качает головой
      и уходит в лес. До деревни вы добираетесь одни.
    choices: []
  talk:
    text: |-
      Она берёт треснувший медальон и кивает: «Теперь история другая.»
      Тропа к деревне открывается сама.
    choices: []
  talk_refuse:
    text: |-
      Она не берёт медальон. «Не твоя рука,» — говорит тихо и исчезает
      между стволами. Тропа к деревне всё же находится, но без её кивка.
    choices: []
  around:
    text: |-
      Обход выводит к пустой деревне. Женщина на тропе
      так и осталась ждать другого путника.
    choices: []
